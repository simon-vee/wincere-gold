      U.group("COME FUNZIONA", '<p class="mut favtip">Tocca la stellina <b class="favst on" style="cursor:default">★</b> accanto a una partita in Pronostici o in Statistiche e scegli la tua giocata. Qui vedi come sta andando, in tempo reale.<br><br>I preferiti restano solo su questo dispositivo e in questo browser.</p>') +
      (cnt("post") ? U.group("PULIZIA", '<button type="button" class="btn small" data-act="fclear">TOGLI LE PARTITE FINITE</button>') : ""), SHOW.find((x) => x[0] === S.show)[1].toLowerCase());
    if (!rows.length) { $("p-body").innerHTML = '<div class="panel"><div class="empty">Nessuna partita nei preferiti.<br>Tocca la stellina ☆ accanto a una partita in <b>Pronostici</b> o in <b>Statistiche</b>, poi scegli la giocata che hai fatto: qui vedrai in tempo reale se la stai prendendo.</div></div>'; return; }
    const shown = rows.filter((r) => S.show === "all" || r.st === S.show || (S.show === "post" && r.st === "?"));
    // prima oggi e i prossimi giorni, poi le partite dei giorni passati (le più recenti in alto)
    const fut = shown.filter((r) => r.vd >= t).sort((a, b) => (a.vd + (a.f.time < "06:00" ? "1" : "0") + a.f.time).localeCompare(b.vd + (b.f.time < "06:00" ? "1" : "0") + b.f.time));
    const past = shown.filter((r) => r.vd < t).sort((a, b) => b.vd.localeCompare(a.vd) || a.f.time.localeCompare(b.f.time));
    let h = rows.some((r) => r.st === "in") && LV ? LV.bar() : "";
    if (!shown.length) { $("p-body").innerHTML = h + '<div class="panel"><div class="empty">Nessuna partita in questo gruppo. <button type="button" class="linkbtn" data-act="fshow" data-c="all">Mostra tutte</button></div></div>'; return; }
    h += '<div class="gtw"><table class="gt fav"><thead><tr><th>ORA</th><th>CAMPIONATO</th><th>CASA</th><th>OSPITE</th><th class="c">PT</th><th class="c">FIN</th><th>LA TUA GIOCATA</th><th></th></tr></thead><tbody>';
    let day = null;
    for (const r of fut.concat(past)) {
      if (r.vd !== day) { day = r.vd; h += '<tr class="favday"><td colspan="8">' + esc(dayLab(day).toUpperCase()) + "</td></tr>"; }
      const f = r.f, L = r.L, live = L && L.state !== "pre", night = f.date !== r.vd;
      const chips = r.bs.length ? r.bs.map((x) => (x.s ? LV.tag(x.s, x.b + (x.s === "W" ? " ✓" : x.s === "L" ? " ✗" : x.s === "w" ? " · per ora ✓" : x.s === "l" ? " · per ora ✗" : " · in corso")) :
        '<span class="res p"' + (live ? ' title="la pagina non sa controllare questa giocata da sola"' : "") + ">" + esc(x.b) + (live ? " ?" : "") + "</span>")).join("") : '<span class="mut">nessuna giocata</span>';
      const fin = live ? esc(LV.scoreTxt(L)) + LV.clockTag(L) : r.st === "pre" ? '<span class="mut">da giocare</span>' : '<span class="mut" title="risultato non trovato">—</span>';
      h += '<tr class="row' + (r.st === "in" ? " favin" : "") + '"><td class="tm">' + star(f, []) + esc(f.time || "—") + (night ? ' <span class="mut">notte</span>' : "") + '</td><td class="cp"><span class="cpi">' + U.flag(f.comp) + esc(U.tc(f.comp)) + "</span></td>" +
        '<td class="tn h">' + esc(f.home) + '<span class="vs"> – ' + esc(f.away) + '</span></td><td class="tn a">' + esc(f.away) + "</td>" +
        '<td class="c ht">' + (live ? esc(LV.htTxt(L)) : "") + '</td><td class="c ft">' + fin + "</td>" +
        '<td class="ch"><span class="chipsm">' + chips + '</span></td><td class="r ed"><button type="button" class="btn small" data-fav="' + esc(JSON.stringify({ m: slim(f), s: [] })) + '">MODIFICA</button></td></tr>';
    }
    $("p-body").innerHTML = h + '</tbody></table></div><div class="note">Durante la partita la pagina si aggiorna da sola ogni 30 secondi. ' + LV.tag("W") + " e " + LV.tag("L") + " = deciso · " + LV.tag("w") + " e " + LV.tag("l") + " = com'è adesso, può ancora cambiare · " + LV.tag("n") + " = si decide più avanti · grigio = partita non ancora iniziata.</div>";
  }
  document.addEventListener("click", (ev) => {
    if (!on()) return;
    const b = ev.target.closest("[data-act]"); if (!b || !b.closest("#p-body, #side")) return;
    const a = b.dataset.act;
    if (a === "fshow") { S.show = b.dataset.c || "all"; render(); }
    else if (a === "fclear") {
      const t = today(), LV = window.APP.live, keep = load().filter((f) => { const L = LV ? LV.get(item(f)) : null; return stateOf(f, L, t) !== "post"; });
      const n = load().length - keep.length;
      if (n && window.confirm("Tolgo dai preferiti " + n + (n === 1 ? " partita finita?" : " partite finite?"))) { save(keep); render(); }
    }
  });

  window.APP.fav = { star, open: openSheet };
  window.APP.apps[ME] = { render, close() { closeSheet(); } };
})();
</script>
<script>
(function () {
  "use strict";
  const names = ["idee", "stats", "storico", "pref"], alias = { pronostici: "idee", statistiche: "stats", preferiti: "pref" }, box = document.getElementById("app");
  function pick() {
    const h0 = location.hash.replace("#", ""), h = alias[h0] || h0;
    if (names.includes(h)) return h;
    try { const s0 = localStorage.getItem("gold.app"), s = alias[s0] || s0; if (names.includes(s)) return s; } catch (e) { /* niente */ }
    return "idee";
  }
  function mount(name) {
    if (!names.includes(name) || window.APP.active === name || !window.APP.apps[name]) return;
    const prev = window.APP.apps[window.APP.active]; if (prev) prev.close();
    window.APP.active = name;
    box.replaceChildren(document.getElementById("tpl-" + name).content.cloneNode(true));
    document.querySelectorAll("[data-app]").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.app === name)));
    try { localStorage.setItem("gold.app", name); } catch (e) { /* niente */ }
    window.APP.apps[name].render();
    if (window.APP.budget) window.APP.budget.paint();
  }
  // passa a un'altra sezione
  window.APP.go = (name) => {
    const was = window.APP.active; mount(name);
    if (was !== window.APP.active) window.scrollTo(0, 0);
    try { if (location.hash !== "#" + name) location.hash = name; } catch (e) { /* niente */ }
  };
  document.addEventListener("click", (ev) => {
    const b = ev.target.closest("[data-app]"); if (!b) return;
    window.APP.go(b.dataset.app);
    const g = b.dataset.goto; if (g) setTimeout(() => { const t = document.getElementById(g); if (t) t.scrollIntoView({ behavior: "smooth", block: "start" }); }, 60);
  });
  // sul telefono la colonna dei filtri si apre e si chiude con il bottone FILTRI
  document.addEventListener("click", (ev) => {
    const t = ev.target.closest && ev.target.closest("[data-sidetog]"); if (!t) return;
    const s = t.closest(".side"); if (!s) return;
    t.setAttribute("aria-expanded", String(s.classList.toggle("open")));
  });
  window.addEventListener("hashchange", () => mount(pick()));
  mount(pick());
})();
</script>
