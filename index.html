    return null;
  }
  const wd = new Intl.DateTimeFormat("it-IT", { weekday: "short" });
  const whenOf = (n) => wd.format(new Date(n.date + "T12:00:00")).replace(".", "") + " " + dm(n.date) + (n.time ? " " + n.time : "");

  // ---------- pezzi di pagina ----------
  const fdot = (f) => '<i class="cf ' + f.k + '" title="' + esc(dm(f.x.d) + " · " + (f.x.home ? "in casa" : "fuori") + " · " + f.a + "-" + f.b) + '">' + f.k + "</i>";
  const formCell = (r) => '<td class="l cfm">' + (r.form.length ? r.form.slice(-5).map(fdot).join("") : '<span class="mut">—</span>') + "</td>";
  const nextCell = (L, r) => { const n = nextOf(L, r.name); return '<td class="l xm cnx">' + (n ? '<span class="nx ' + (n.home ? "in" : "out") + '">' + (n.home ? "C" : "F") + "</span> " + esc(n.opp) + ' <span class="mut num">' + esc(whenOf(n)) + "</span>" : '<span class="mut">—</span>') + "</td>"; };
  const TH = (k, label, cls, tip) => '<th class="' + (cls || "") + (S.sort === k ? " on" : "") + '" data-act="csort" data-k="' + k + '"' + (tip ? ' title="' + esc(tip) + '"' : "") + ">" + label + (S.sort === k ? (S.dir > 0 ? " ▴" : " ▾") : "") + "</th>";
  function sorted(rows) {
    if (!S.sort) return rows;
    const val = (r) => { const k = S.sort; return k === "name" ? r.name : k === "media" ? (r.pg ? r.pts / r.pg : 0) : ["o15", "o25", "gg", "cs", "fts", "o05pt"].includes(k) ? (r.pg ? r[k] / r.pg : 0) : k === "gfm" ? (r.pg ? r.gf / r.pg : 0) : k === "gsm" ? (r.pg ? r.gs / r.pg : 0) : k === "gptm" ? (r.pg ? r.gpt / r.pg : 0) : r[k]; };
    return rows.slice().sort((a, b) => { const x = val(a), y = val(b); return (typeof x === "string" ? x.localeCompare(y) : x - y) * S.dir || a.pos - b.pos; });
  }
  function detail(L, r) {
    if (r.i < 0) return '<div class="hint">Squadra non presente nei nostri dati.</div>';
    const all = computed(L, "gen", 0, "all")[r.i], home = computed(L, "home", 0, "all")[r.i], away = computed(L, "away", 0, "all")[r.i], pt = computed(L, "pt", 0, "all")[r.i];
    const line = (lab, x) => '<div class="cdl"><span class="cbk">' + lab + '</span><span class="num">' + x.pg + " partite · " + x.v + "V " + x.n + "N " + x.p + "P · gol " + x.gf + "-" + x.gs + " · <b>" + x.pts + " punti</b> (" + avg(x.pts, x.pg) + " a partita)</span></div>";
    const n = nextOf(L, r.name);
    let h = '<div class="cdet"><div class="cdg">' + line("IN CASA", home) + line("IN TRASFERTA", away) + line("PRIMO TEMPO", pt) +
      '<div class="cdl"><span class="cbk">PROSSIMA</span><span>' + (n ? (n.home ? "in casa con " : "fuori, a ") + "<b>" + esc(n.opp) + "</b> · " + esc(whenOf(n)) : '<span class="mut">nessuna nei prossimi 10 giorni</span>') + "</span></div></div>";
    const last = all.games.slice(-10).reverse();
    h += '<div class="cdh">ULTIME ' + last.length + ' PARTITE <span class="mut">(dalla più recente)</span></div><table class="cdt"><tbody>' + last.map((x) => {
      const k = res(x.ff, x.fs);
      return '<tr><td class="num mut">' + dm(x.d) + '</td><td><span class="nx ' + (x.home ? "in" : "out") + '">' + (x.home ? "C" : "F") + "</span></td><td class=\"l\">" + esc(L.teams[x.opp].t) + '</td><td class="num mut">PT ' + x.hf + "-" + x.hs + '</td><td class="num"><b>' + x.ff + "-" + x.fs + '</b></td><td><i class="cf ' + k + '">' + k + "</i></td></tr>";
    }).join("") + "</tbody></table></div>";
    return h;
  }
  function standingTable(L, rows, zones, ncols) {
    const kind = S.tab;
    let h = '<div class="scroll"><table class="stab ctab"><thead><tr>' + TH("pos", "#", "l") + TH("name", "SQUADRA", "l") + TH("pg", "PG", "", "partite giocate") + TH("v", "V", "xm", "vinte") + TH("n", "N", "xm", "pareggiate") + TH("p", "P", "xm", "perse") +
      TH("gf", "GF", "xm", "gol fatti") + TH("gs", "GS", "xm", "gol subiti") + TH("dr", "DR", "", "differenza reti") + TH("pts", "PUNTI", "") + TH("media", "MEDIA", "xm", "punti a partita") +
      '<th class="l">FORMA</th>' + (kind === "gen" || kind === "home" || kind === "away" ? '<th class="l xm">PROSSIMA</th>' : "") + "</tr></thead><tbody>";
    sorted(rows).forEach((r) => {
      const k = L.code + "|" + r.i, open = S.open.has(k), z = zones && r.zone >= 0 ? L.tab.notes[r.zone] : null;
      h += '<tr class="click' + (open ? " sel" : "") + '" data-act="copen" data-k="' + esc(k) + '"><td class="l num cpos"' + (z ? ' style="box-shadow: inset 4px 0 0 ' + esc(z[1]) + '" title="' + esc(z[0]) + '"' : "") + ">" + r.pos + '</td><td class="l"><b>' + esc(r.name) + "</b>" + (r.ded ? ' <span class="tag l" title="punti di penalità">−' + Math.abs(r.ded) + "</span>" : "") + "</td>" +
        '<td class="num">' + r.pg + '</td><td class="num xm">' + r.v + '</td><td class="num xm">' + r.n + '</td><td class="num xm">' + r.p + '</td><td class="num xm">' + r.gf + '</td><td class="num xm">' + r.gs + '</td><td class="num">' + sgn(r.dr) +
        '</td><td class="num"><b>' + r.pts + '</b></td><td class="num xm">' + avg(r.pts, r.pg) + "</td>" + formCell(r) + (kind === "gen" || kind === "home" || kind === "away" ? nextCell(L, r) : "") + "</tr>";
      if (open) h += '<tr class="det"><td colspan="' + ncols + '">' + detail(L, r) + "</td></tr>";
    });
    h += "</tbody></table></div>";
    if (zones && L.tab.notes.length) h += '<div class="czl">' + L.tab.notes.map((n) => '<span><i style="background:' + esc(n[1]) + '"></i>' + esc(n[0]) + "</span>").join("") + "</div>";
    return h;
  }
  function golTable(L, rows) {
    let h = '<div class="scroll"><table class="stab ctab"><thead><tr><th class="l">#</th>' + TH("name", "SQUADRA", "l") + TH("pg", "PG", "", "partite giocate") + TH("gfm", "GOL FATTI", "", "media a partita") + TH("gsm", "GOL SUBITI", "", "media a partita") +
      TH("o15", "OVER 1,5", "xm") + TH("o25", "OVER 2,5") + TH("gg", "GOAL", "", "segnano tutte e due") + TH("cs", "PORTA INVIOLATA", "xm", "non subisce gol") + TH("fts", "SENZA SEGNARE", "xm", "non segna") +
      TH("o05pt", "OVER 0,5 PT", "xm", "almeno un gol nel primo tempo") + TH("gptm", "GOL NEL PT", "xm", "gol nel primo tempo a partita (fatti + subiti)") + "</tr></thead><tbody>";
    const col = (v, n) => { const p = n ? v / n : null; return '<td class="num ' + (p === null ? "mut" : p >= 0.7 ? "up" : p < 0.3 ? "mut" : "") + '">' + pc(v, n) + "</td>"; };
    sorted(rows).forEach((r, k) => {
      const kk = L.code + "|" + r.i, open = S.open.has(kk);
      h += '<tr class="click' + (open ? " sel" : "") + '" data-act="copen" data-k="' + esc(kk) + '"><td class="l num mut">' + (k + 1) + '</td><td class="l"><b>' + esc(r.name) + '</b></td><td class="num">' + r.pg + '</td><td class="num">' + avg(r.gf, r.pg) + '</td><td class="num">' + avg(r.gs, r.pg) + "</td>" +
        col(r.o15, r.pg).replace('<td class="num', '<td class="num xm') + col(r.o25, r.pg) + col(r.gg, r.pg) + col(r.cs, r.pg).replace('<td class="num', '<td class="num xm') + col(r.fts, r.pg).replace('<td class="num', '<td class="num xm') +
        col(r.o05pt, r.pg).replace('<td class="num', '<td class="num xm') + '<td class="num xm">' + avg(r.gpt, r.pg) + "</td></tr>";
      if (open) h += '<tr class="det"><td colspan="12">' + detail(L, r) + "</td></tr>";
    });
    return h + "</tbody></table></div>";
  }
  function leaguePanel(L) {
    const t = table(L), kind = S.tab, per = S.per ? " · ultime " + S.per + " partite di ogni squadra" : "";
    const right = kind === "gen" && t.off ? "classifica ufficiale ESPN del " + dm(L.tab.at) : "partite fino al " + dm(L.last) + per + (kind === "gol" && S.side !== "all" ? " · " + (S.side === "home" ? "solo in casa" : "solo fuori") : "");
    let h = '<div class="panel"><div class="ph"><span>' + U().flag(L.name) + " " + esc(L.name) + '</span><span class="r">' + esc(right) + "</span></div>";
    if (kind === "gol") h += golTable(L, t.rows);
    else if (t.groups) t.groups.forEach((g) => { if (t.groups.length > 1) h += '<div class="cgn">' + esc(g.name) + "</div>"; h += standingTable(L, g.rows, true, 13); });
    else h += standingTable(L, t.rows, false, kind === "gen" || kind === "home" || kind === "away" ? 13 : 12);
    return h + "</div>";
  }
  function sideHtml(Ls) {
    const u = U();
    let h = u.group("PERIODO", u.pills("cper", [["0", "Stagione"], ["10", "Ultime 10"], ["5", "Ultime 5"]], (v) => Number(v) === S.per));
    if (S.tab === "gol") h += u.group("PARTITE", u.pills("cside", [["all", "Tutte"], ["home", "In casa"], ["away", "Fuori"]], (v) => v === S.side));
    const list = Ls.slice().sort((a, b) => u.compOrder(a.name, b.name));
    let last = null, rows = '<button type="button" class="lrow rad' + (S.league === "ALL" ? " on" : "") + '" data-act="cleague" data-c="ALL"><span class="ck"></span><span class="ln">Tutti (uno sotto l\'altro)</span></button>';
    list.forEach((L) => { const k = u.country(L.name); if (k !== last) { rows += '<div class="lnat">' + esc((u.NAT[k] || "").toUpperCase()) + "</div>"; last = k; }
      rows += '<button type="button" class="lrow rad' + (S.league === L.code ? " on" : "") + '" data-act="cleague" data-c="' + esc(L.code) + '"><span class="ck"></span>' + u.flag(L.name) + '<span class="ln">' + esc(u.tc(L.name)) + '</span><span class="lc num">' + L.teams.length + "</span></button>"; });
    h += u.group('CAMPIONATO <span class="mut">· squadre</span>', '<div class="lgl">' + rows + "</div>");
    const cur = Ls.find((L) => L.code === S.league);
    return u.side(h, (cur ? cur.name : "tutti i campionati") + " · " + TABN[S.tab]);
  }
  function render() {
    if (!on()) return;
    const raw = window.APP.stats && window.APP.stats.raw ? window.APP.stats.raw() : null;
    S.data = raw;
    if (!raw) { $("c-body").innerHTML = '<div class="panel"><div class="empty">' + (window.APP.stats && window.APP.stats.err && window.APP.stats.err() ? "Classifiche non disponibili: chiedi a Claude di aggiornare le statistiche." : "CARICAMENTO…") + "</div></div>"; return; }
    const Ls = raw.leagues || [];
    if (S.league !== "ALL" && !Ls.some((L) => L.code === S.league)) S.league = Ls.length ? Ls[0].code : "ALL";
    const shown = S.league === "ALL" ? Ls.slice().sort((a, b) => U().compOrder(a.name, b.name)) : Ls.filter((L) => L.code === S.league);
    const cur = shown.length === 1 ? shown[0] : null;
    $("tb-left").textContent = "· " + (cur ? cur.name.toLowerCase().replace(/(^|\s)\S/g, (c) => c.toUpperCase()) + " · " : "") + TABN[S.tab];
    const at = Ls.map((L) => L.tab && L.tab.at).filter(Boolean).sort().pop();
    $("tb-right").textContent = "Classifiche ufficiali ESPN" + (at ? " del " + dm(at) : "") + " · le altre calcolate dalle partite fino al " + dm(raw.last) + " · " + Ls.length + " campionati";
    const nT = shown.reduce((a, L) => a + L.teams.length, 0), nG = shown.reduce((a, L) => a + (L.g || []).length, 0);
    const k = (l, v, n) => '<div class="k"><span class="l">' + l + '</span><span class="v num">' + v + "</span>" + (n ? '<span class="n">' + n + "</span>" : "") + "</div>";
    let lead = "";
    if (cur && cur.tab && cur.tab.grp && cur.tab.grp[0]) { const r = cur.tab.grp[0].rows[0]; lead = typeof r[0] === "number" ? cur.teams[r[0]].t : String(r[0]); }
    $("kpis").innerHTML = k("CAMPIONATI", String(shown.length)) + k("SQUADRE", String(nT)) + k("PARTITE", String(nG), "giocate") + (lead ? k("IN TESTA", esc(lead), "") : "");
    $("side").innerHTML = sideHtml(Ls);
    const tabs = '<div class="tabrow"><nav class="tabs" role="tablist">' + TABS.map(([t, l]) => '<button class="tab" role="tab" type="button" data-act="ctab" data-tab="' + t + '" aria-selected="' + (S.tab === t) + '">' + l + "</button>").join("") +
      '</nav><button type="button" class="legbtn" data-act="legend" data-lg="classi" title="Legenda: come si legge questa pagina" aria-label="Legenda">?</button></div>';
    $("c-body").innerHTML = tabs + shown.map(leaguePanel).join("");
  }

  // ---------- eventi ----------
  document.addEventListener("click", (ev) => {
    if (!on()) return;
    const b = ev.target.closest("[data-act]"); if (!b || !b.closest("#c-body, #side")) return;
    const a = b.dataset.act;
    if (a === "ctab") { S.tab = b.dataset.tab; S.sort = null; save(); render(); }
    else if (a === "cper") { S.per = Number(b.dataset.c) || 0; save(); render(); }
    else if (a === "cside") { S.side = b.dataset.c; save(); render(); }
    else if (a === "cleague") { S.league = b.dataset.c; S.open.clear(); save(); render(); }
    else if (a === "csort") { const k = b.dataset.k; if (S.sort === k) S.dir = -S.dir; else { S.sort = k; S.dir = ["pos", "name", "gs", "gsm", "p", "fts"].includes(k) ? 1 : -1; } render(); }
    else if (a === "copen") { const k = b.dataset.k; if (S.open.has(k)) S.open.delete(k); else S.open.add(k); render(); }
  });
  document.addEventListener("gold-stats", () => render());
  window.APP.apps[ME] = { render, close() {} };
})();
</script>
<script>
// LA BOLLETTA (dal 24/11/2026, chiesta dall'utente): la schedina del giorno composta dalla pagina con i nostri calcoli.
// L'utente sceglie quante partite, la quota minima per partita e l'importo. Per ogni partita del giorno la pagina prende,
// tra le giocate provate da controlli.py (fixtures.adv), la più probabile con quota >= minima e senza controlli contro (✗);
// poi tiene le N partite con la stima più alta. Quota: quella scritta dall'utente, se no quella vera del bookmaker, se no la probabile (~).
// Scelte, quote scritte, partite scartate e bollette giocate (STORICO BOLLETTE) restano solo nel browser (localStorage "gold.bol").
(function () {
  "use strict";
  const ME = "bol", on = () => window.APP.active === ME, KEY = "gold.bol";
  const DEF = { n: 3, qmin: 1.2, imp: 10 }, EDGE = 1.03;
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const plain = (s) => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toUpperCase().replace(/[^A-Z0-9]+/g, " ").trim();
  const nf = new Intl.NumberFormat("it-IT", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const q2 = (n) => nf.format(Math.round(Number(n) * 100) / 100);
  const eur = (n) => nf.format(Math.round(Number(n) * 100) / 100) + " €";
  const sgn = (n) => (n > 0.004 ? "+" : n < -0.004 ? "−" : "") + nf.format(Math.abs(Math.round(n * 100) / 100)) + " €";
  const romeFmt = new Intl.DateTimeFormat("sv-SE", { timeZone: "Europe/Rome", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hour12: false });
  const nowRome = () => { const s = romeFmt.format(new Date()); return { date: s.slice(0, 10), time: s.slice(11, 16) }; };
  const addDays = (iso, n) => { const d = new Date(iso + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
  // le partite prima delle 06:00 stanno nel giorno prima ("notte"), come nel resto della pagina
  const vdayOf = (date, time) => (time && time < "06:00" ? addDays(date, -1) : date);
  const today = () => { const n = nowRome(); return vdayOf(n.date, n.time); };
  const wd = new Intl.DateTimeFormat("it-IT", { weekday: "long", day: "numeric", month: "long", timeZone: "UTC" });
  const dayLab = (d) => { const t = today(); return (d === t ? "oggi · " : d === addDays(t, 1) ? "domani · " : d === addDays(t, -1) ? "ieri · " : "") + wd.format(new Date(d + "T12:00:00Z")); };
  const begun = (x) => { if (!x.date || !x.time) return false; const n = nowRome(); return x.date + " " + x.time <= n.date + " " + n.time; };

  // ---------- archivio nel browser ----------
  let MEM = null;
  function st() {
    if (MEM) return MEM;
    try { MEM = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { MEM = {}; }
    if (!MEM.q || typeof MEM.q !== "object") MEM.q = {};
    if (!MEM.skip || typeof MEM.skip !== "object") MEM.skip = {};
    if (!Array.isArray(MEM.hist)) MEM.hist = [];
    return MEM;
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(st())); return true; } catch (e) { toast("Non riesco a salvare: il browser non lo permette (navigazione privata?)"); return false; }
  }
  const nSet = () => { const v = Math.round(Number(st().n)); return v >= 1 && v <= 10 ? v : DEF.n; };
  const qSet = () => { const v = Number(st().qmin); return v > 1 ? v : DEF.qmin; };
  const iSet = () => { const v = Number(st().imp); return v > 0 ? v : DEF.imp; };
  const userQ = (k) => (Number(st().q[k]) > 1 ? Number(st().q[k]) : 0);

  // ---------- dati ----------
  const S = { tab: "day", day: null, fresh: false, show: "all", fixtures: [], picks: [], ready: false, err: "" };
  const keyOf = (f, m) => f.id + "|" + m;
  function quote(f, c) {
    const u = userQ(keyOf(f, c.m));
    if (u) return { q: u, src: "tua" };
    if (Number(c.q) > 1) return { q: Number(c.q), src: "book" };
    if (Number(c.qe) > 1) return { q: Number(c.qe), src: "stima" };
    return { q: 0, src: "" };
  }
  const item = (x) => ({ date: x.date, time: x.time, comp: x.comp, home: x.home, away: x.away, links: x.links || [] });
  const slimLinks = (ls) => (Array.isArray(ls) ? ls : []).filter((l) => l && /gameId\/\d+/.test(l.u || "")).map((l) => ({ t: l.t, u: l.u }));
  const days = () => {
    const t = today();
    return Array.from(new Set(S.fixtures.filter((f) => f.adv && Array.isArray(f.adv.c) && f.adv.c.length).map((f) => vdayOf(f.date, f.time)).filter((d) => d >= t))).sort();
  };

  // LA BOLLETTA: per ogni partita la giocata più probabile con quota >= minima, poi le N partite migliori
  function build(day) {
    const qmin = qSet(), n = nSet(), skip = new Set(st().skip[day] || []);
    const pk = new Set(S.picks.filter((p) => p && p.date && vdayOf(p.date, p.time) === day).map((p) => plain(p.match) + "|" + plain(p.market)));
    const fx = S.fixtures.filter((f) => vdayOf(f.date, f.time) === day && f.adv && Array.isArray(f.adv.c));
    const per = []; let nBegun = 0;
    for (const f of fx) {
      if (skip.has(f.id)) continue;
      const bg = begun(f);
      if (bg) nBegun++;
      if (S.fresh && bg) continue;
      let best = null;
      for (const c of f.adv.c) {
        const est = Number(c.est);
        if (!(est > 0) || String(c.v || "").includes("x")) continue;  // nessun controllo contro
        const Q = quote(f, c);
        if (!Q.q || Q.q < qmin) continue;
        const o = { f, m: c.m, est, safe: !!c.safe, q: Q.q, src: Q.src, key: keyOf(f, c.m), begun: bg, pick: pk.has(plain(f.home + " - " + f.away) + "|" + plain(c.m)) };
        if (!best || o.est > best.est || (o.est === best.est && (o.safe > best.safe || (o.safe === best.safe && o.q > best.q)))) best = o;
      }
      if (best) per.push(best);
    }
    per.sort((a, b) => b.est - a.est || b.safe - a.safe || b.q - a.q);
    const legs = per.slice(0, n).sort((a, b) => (a.f.time < "06:00" ? "1" : "0").concat(a.f.time).localeCompare((b.f.time < "06:00" ? "1" : "0").concat(b.f.time)));
    return { legs, n, qmin, imp: iSet(), found: per.length, skipped: skip.size, nBegun, total: fx.length };
  }
  function totals(legs, imp) {
    const qt = legs.reduce((a, l) => a * l.q, 1), p = legs.reduce((a, l) => a * l.est / 100, 1);
    return { qt, p, win: imp * qt, net: imp * qt - imp, ev: p * qt, need: Math.ceil(EDGE * 100 / p) / 100 };
  }
  function judge(T) {
    if (T.ev >= EDGE) return { k: "go", t: "CONVIENE", why: "La quota totale è più alta di quella che serve (" + q2(T.need) + "): alla lunga questa bolletta guadagna." };
    if (T.ev >= 0.95) return { k: "small", t: "AL LIMITE", why: "Per essere conveniente servirebbe una quota totale di almeno " + q2(T.need) + ". Se la giochi, punta poco." };
    return { k: "no", t: "NON CONVIENE", why: "Per essere conveniente servirebbe una quota totale di almeno " + q2(T.need) + ": con queste quote, alla lunga, si perde. Prova a scrivere le quote del tuo bookmaker o a cambiare le scelte." };
  }
  const vtag = (k, t) => '<span class="cv cv-' + k + '">' + esc(t) + "</span>";
  const once = (p) => (p >= 0.95 ? "quasi sempre" : p >= 0.15 ? "circa " + Math.round(p * 10) + " volte su 10" : "circa 1 volta su " + Math.round(1 / p));

  // stato live di una giocata e di una bolletta
  function legState(x) {
    const LV = window.APP.live; if (!LV) return { L: null, s: null };
    const L = LV.get(item(x));
    return { L, s: L && L.state !== "pre" ? LV.market(x.m, L) : null };
  }
  function slipState(states) {
    if (states.some((s) => s === "L")) return "L";
    if (states.length && states.every((s) => s === "W")) return "W";
    if (states.some((s) => s)) return "n";
    return "pre";
  }
  const STX = { W: ["W", "✓ VINTA"], L: ["L", "✗ PERSA"], n: ["n", "IN CORSO"] };
  const sTag = (s, LV) => (s === "pre" || !LV ? '<span class="res p">DA GIOCARE</span>' : LV.tag(STX[s][0], STX[s][1]));
  const legTag = (s, LV) => (!s || !LV ? "" : LV.tag(s, s === "W" ? "✓ PRESA" : s === "L" ? "✗ PERSA" : s === "w" ? "PER ORA ✓" : s === "l" ? "PER ORA ✗" : "IN CORSO"));

  // ---------- pezzi di pagina ----------
  const k = (l, v, c, n) => '<div class="k"><span class="l">' + l + '</span><span class="v num ' + (c || "") + '">' + v + "</span>" + (n ? '<span class="n">' + n + "</span>" : "") + "</div>";
  const tabs = () => '<div class="tabrow"><nav class="tabs" role="tablist">' + [["day", "LA BOLLETTA DEL GIORNO"], ["hist", "STORICO BOLLETTE · " + st().hist.length]].map(([t, l]) =>
    '<button class="tab" role="tab" type="button" data-bact="tab" data-c="' + t + '" aria-selected="' + (S.tab === t) + '">' + l + "</button>").join("") +
    '</nav><button type="button" class="legbtn" data-act="legend" data-lg="bol" title="Legenda: come funziona la bolletta" aria-label="Legenda">?</button></div>';
  const srcTxt = (l) => (l.src === "tua" ? "la tua quota" : l.src === "book" ? "bookmaker" : "stimata");
  const qShow = (l) => (l.src === "stima" ? "~" : "") + q2(l.q);
  function legRow(l, i, LV, editable) {
    const f = l.f || l, U = window.APP.ui, S1 = legState({ date: f.date, time: f.time, comp: f.comp, home: f.home, away: f.away, links: f.links, m: l.m }), live = S1.L && S1.L.state !== "pre";
    const tags = (l.safe ? ' <span class="tag safe">SICURO</span>' : "") + (l.pick ? ' <span class="tag w" title="è anche tra i pronostici del giorno">PRONOSTICO</span>' : "") + (editable && l.begun && !live ? ' <span class="tag o">GIÀ INIZIATA</span>' : "");
    return '<tr class="row"><td class="c bn num">' + (i + 1) + '</td><td class="tm">' + esc(f.time || "—") + (f.time && f.time < "06:00" ? ' <span class="mut">notte</span>' : "") + "</td>" +
      '<td class="bm"><b>' + esc(f.home) + " – " + esc(f.away) + '</b><span class="mut bcp">' + (U ? U.flag(f.comp) : "") + esc(U ? U.tc(f.comp) : f.comp) + '<span class="btm"> · ' + esc(f.time || "") + "</span></span></td>" +
      '<td class="bg"><b>' + esc(l.m) + "</b>" + tags + "</td>" +
      '<td class="c num bp"><b>' + l.est + "%</b></td>" +
      '<td class="c bq">' + (editable ? '<input class="cq" type="number" inputmode="decimal" step="0.01" min="1.01" data-bq="' + esc(l.key) + '" value="' + (l.src === "tua" ? l.q : "") + '" placeholder="' + q2(l.q) + '" title="Scrivi la quota del tuo bookmaker"><span class="mut bqs">' + esc(srcTxt(l)) + (l.src !== "tua" ? " " + qShow(l) : "") + "</span>" : '<b class="num">' + qShow(l) + "</b>") + "</td>" +
      '<td class="c bes">' + (live ? '<span class="num">' + esc(LV.scoreTxt(S1.L)) + "</span> " + LV.clockTag(S1.L) + " " + legTag(S1.s, LV) : '<span class="mut">' + (begun(f) ? "—" : "da giocare") + "</span>") + "</td>" +
      (editable ? '<td class="r bxc"><button type="button" class="bx" data-bact="skip" data-c="' + esc(f.id) + '" title="Scarta questa partita: al suo posto entra la migliore delle altre" aria-label="Scarta">×</button></td>' : "") + "</tr>";
  }
  const sum = (T, imp, extra) => '<div class="bsum">' +
    '<div class="bsk"><span class="l">QUOTA TOTALE</span><span class="v num">' + q2(T.qt) + "</span></div>" +
    '<div class="bsk"><span class="l">PROBABILITÀ</span><span class="v num">' + Math.round(T.p * 100) + '%</span><span class="n">' + esc(once(T.p)) + "</span></div>" +
    '<div class="bsk"><span class="l">IMPORTO</span><span class="v num">' + eur(imp) + "</span></div>" +
    '<div class="bsk"><span class="l">VINCITA</span><span class="v num">' + eur(imp * T.qt) + "</span></div>" +
    '<div class="bsk up"><span class="l">' + (extra === "" ? "UTILE SE VINTA" : "UTILE") + '</span><span class="v num">' + sgn(imp * T.qt - imp) + "</span></div>" + (extra || "") + "</div>";

  // ---------- scheda LA BOLLETTA DEL GIORNO ----------
  function renderDay(LV, U) {
    const ds = days(), t = today();
    if (!S.day || !ds.includes(S.day)) S.day = ds.includes(t) ? t : ds[0] || null;
    $("side").innerHTML = U.side((ds.length ? U.group("GIORNO", U.pills("bday", ds.map((d) => [d, d === t ? "OGGI" : d === addDays(t, 1) ? "DOMANI" : esc(wd.format(new Date(d + "T12:00:00Z")))]), (v) => v === S.day)) : "") +
      U.group("COME FUNZIONA", '<p class="mut favtip">Scegli quante partite, la quota minima per partita e l\'importo. La pagina compone la bolletta con le giocate più probabili secondo i nostri calcoli (stima combinata, controlli, quote).<br><br>Tocca <b>×</b> per scartare una partita: entra la migliore delle altre. Scrivi la quota del tuo bookmaker per avere vincita e utile esatti.<br><br>Scelte e bollette giocate restano solo su questo dispositivo.</p>'), S.day ? dayLab(S.day) : "");
    const set = '<div class="panel bset"><div class="bsh">IMPOSTA LA TUA BOLLETTA</div><div class="bsr">' +
      '<label><span class="lab">PARTITE</span><input class="cq" type="number" inputmode="numeric" step="1" min="1" max="10" data-bset="n" value="' + nSet() + '"></label>' +
      '<label><span class="lab">QUOTA MINIMA PER PARTITA</span><input class="cq" type="number" inputmode="decimal" step="0.01" min="1.01" data-bset="qmin" value="' + qSet() + '"></label>' +
      '<label><span class="lab">IMPORTO</span><span class="beur"><input class="cq" type="number" inputmode="decimal" step="0.5" min="0.5" data-bset="imp" value="' + iSet() + '"> €</span></label>' +
      '</div><div class="mut bsn">Le scelte restano su questo dispositivo. Cambiale quando vuoi: la bolletta si rifà subito.</div></div>';
    let h = tabs();
    if (!S.ready) { $("b-body").innerHTML = h + '<div class="panel"><div class="empty">Carico le partite…</div></div>'; return; }
    if (S.err) { $("b-body").innerHTML = h + '<div class="panel"><div class="empty">' + esc(S.err) + "</div></div>"; return; }
    if (!S.day) {
      $("kpis").innerHTML = ""; $("tb-left").textContent = ""; $("tb-right").textContent = "";
      $("b-body").innerHTML = h + set + '<div class="panel"><div class="empty">Non ci sono ancora partite analizzate per oggi o per i prossimi giorni.<br>Chiedi a Claude i pronostici del giorno: la bolletta si compone da sola.</div></div>'; return;
    }
    const B = build(S.day), legs = B.legs, T = totals(legs, B.imp), J = judge(T);
    $("tb-left").textContent = "· " + dayLab(S.day);
    $("tb-right").textContent = B.total + " partite analizzate · " + B.found + " con una giocata a quota da " + q2(B.qmin) + " in su";
    $("kpis").innerHTML = legs.length ? k("QUOTA TOTALE", q2(T.qt)) + k("PROBABILITÀ", Math.round(T.p * 100) + "%", "", once(T.p)) + k("VINCITA", eur(T.win), "", "con " + eur(B.imp)) + k("UTILE", sgn(T.net), "up") : "";
    if (LV) LV.need(legs.map((l) => item(l.f)).concat(st().hist.filter((b) => b.day === S.day).flatMap((b) => b.legs.map(item))));
    h += set;
    // le bollette di questo giorno già giocate
    const mine = st().hist.filter((b) => b.day === S.day);
    if (mine.length) h += mine.map((b) => histCard(b, LV, true)).join("");
    h += '<div class="panel bcard"><div class="bch"><span class="bct">🎟 LA BOLLETTA DEL GIORNO</span><span class="mut">' + esc(dayLab(S.day)) + " · " + legs.length + (legs.length === 1 ? " partita" : " partite") + " · quota minima " + q2(B.qmin) + " per partita</span></div>";
    if (!legs.length) {
      h += '<div class="empty">Nessuna partita ha una giocata con quota da ' + q2(B.qmin) + " in su" + (B.skipped ? " (" + B.skipped + " scartate da te)" : "") + ".<br>Abbassa la quota minima, oppure scrivi le quote del tuo bookmaker nei Pronostici.</div>";
    } else {
      if (legs.length < B.n) h += '<div class="bwarn">Oggi solo <b>' + legs.length + "</b> " + (legs.length === 1 ? "partita ha" : "partite hanno") + " una giocata con quota da " + q2(B.qmin) + " in su (ne avevi chieste " + B.n + "). Abbassa la quota minima per averne di più.</div>";
      h += '<div class="gtw"><table class="gt bt"><thead><tr><th class="c">#</th><th>ORA</th><th>PARTITA</th><th>GIOCATA</th><th class="c">PROB.</th><th class="c">QUOTA</th><th class="c">ESITO</th><th></th></tr></thead><tbody>' +
        legs.map((l, i) => legRow(l, i, LV, true)).join("") + "</tbody></table></div>";
      const sts = legs.map((l) => legState({ date: l.f.date, time: l.f.time, comp: l.f.comp, home: l.f.home, away: l.f.away, links: l.f.links, m: l.m }).s);
      const ss = slipState(sts), played = mine.some((b) => sameSlip(b, legs));
      h += sum(T, B.imp, '<div class="bsk"><span class="l">ESITO</span><span class="v">' + sTag(ss, LV) + "</span>" + (ss !== "pre" ? '<span class="n">' + sts.filter((s) => s === "W").length + " su " + legs.length + " prese</span>" : "") + "</div>");
      h += '<div class="bjud">' + vtag(J.k, J.t) + '<span>' + esc(J.why) + (legs.some((l) => l.src === "stima") ? " Le quote con ~ sono stimate dalle quote del bookmaker: scrivi le tue per il conto esatto." : "") + "</span></div>";
      h += '<div class="bfoot">' + (played ? '<span class="tag w">✓ GIÀ NEL TUO STORICO</span>' : '<button type="button" class="btn primary" data-bact="play">✓ L\'HO GIOCATA</button>') +
        '<span class="mut">Salva la bolletta nello STORICO BOLLETTE con quote e importo di adesso: lì vedi se l\'hai vinta e l\'utile.</span></div>';
    }
    const notes = [];
    if (B.skipped) notes.push("Hai scartato " + B.skipped + (B.skipped === 1 ? " partita" : " partite") + '. <button type="button" class="linkbtn" data-bact="unskip">Rimettile</button>');
    if (B.nBegun && !S.fresh && legs.some((l) => l.begun)) notes.push('Alcune partite sono già iniziate. <button type="button" class="linkbtn" data-bact="fresh">Rifalla solo con le partite non ancora iniziate</button>');
    if (S.fresh) notes.push('Sto usando solo le partite non ancora iniziate. <button type="button" class="linkbtn" data-bact="fresh">Usa tutte le partite del giorno</button>');
    if (notes.length) h += '<div class="bnotes">' + notes.map((x) => "<div>" + x + "</div>").join("") + "</div>";
    h += "</div>";
    h += '<div class="note">Come sceglie: per ogni partita prende la giocata <b>più probabile</b> (stima combinata dei Pronostici) con quota almeno ' + q2(B.qmin) + " e nessun controllo contro (✗); poi tiene le " + B.n + " partite con la stima più alta. Probabilità della bolletta = prodotto delle stime. " +
      "⏳ Prima di giocare guarda le formazioni ufficiali. ⚠ Gioca solo soldi che puoi permetterti di perdere: ogni partita in più abbassa la probabilità.</div>";
    $("b-body").innerHTML = h;
  }
  const sameSlip = (b, legs) => b.legs.length === legs.length && legs.every((l) => b.legs.some((x) => x.fid === l.f.id && x.m === l.m));

  // ---------- scheda STORICO BOLLETTE ----------
  function evalSlip(b, LV) {
    const sts = b.legs.map((x) => legState(x).s), s = slipState(sts);
    return { sts, s, won: sts.filter((x) => x === "W").length };
  }
  function histCard(b, LV, small) {
    const E = evalSlip(b, LV), T = { qt: b.qt, p: b.p };
    const res = E.s === "W" ? '<b class="up num">' + sgn(b.imp * b.qt - b.imp) + "</b>" : E.s === "L" ? '<b class="down num">' + sgn(-b.imp) + "</b>" : '<span class="mut">in attesa</span>';
    let h = '<div class="panel bcard bh' + (E.s === "W" ? " won" : E.s === "L" ? " lost" : "") + '"><div class="bch"><span class="bct">' + (small ? "🎟 LA TUA BOLLETTA GIOCATA" : "🎟 " + esc(dayLab(b.day).toUpperCase())) + "</span>" +
      '<span class="mut">' + b.legs.length + (b.legs.length === 1 ? " partita" : " partite") + " · giocata il " + esc(new Date(b.at).toLocaleString("it-IT", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" })) + "</span>" +
      '<span class="bhr">' + sTag(E.s, LV) + " " + res + '<button type="button" class="bx" data-bact="del" data-c="' + esc(String(b.id)) + '" title="Togli dallo storico" aria-label="Togli dallo storico">×</button></span></div>';
    h += '<div class="gtw"><table class="gt bt"><thead><tr><th class="c">#</th><th>ORA</th><th>PARTITA</th><th>GIOCATA</th><th class="c">PROB.</th><th class="c">QUOTA</th><th class="c">ESITO</th></tr></thead><tbody>' +
      b.legs.map((x, i) => legRow(Object.assign({}, x, { f: x }), i, LV, false)).join("") + "</tbody></table></div>";
    return h + sum(T, b.imp, "") + "</div>";
  }
  function renderHist(LV, U) {
    const H = st().hist.slice().sort((a, b) => b.day.localeCompare(a.day) || b.at - a.at);
    if (LV) LV.need(H.flatMap((b) => b.legs.map(item)), true);
    const ev = H.map((b) => ({ b, E: evalSlip(b, LV) })), dec = ev.filter((x) => x.E.s === "W" || x.E.s === "L");
    const won = ev.filter((x) => x.E.s === "W"), lost = ev.filter((x) => x.E.s === "L");
    const staked = dec.reduce((a, x) => a + x.b.imp, 0), back = won.reduce((a, x) => a + x.b.imp * x.b.qt, 0), net = back - staked;
    const SHOW = [["all", "Tutte", ev.length], ["W", "Vinte", won.length], ["L", "Perse", lost.length], ["open", "In attesa", ev.length - dec.length]];
    $("side").innerHTML = U.side(U.group("MOSTRA", U.pills("bshow", SHOW.map((x) => [x[0], x[1] + ' <span class="mut num">' + x[2] + "</span>"]), (v) => S.show === v)) +
      U.group("COME FUNZIONA", '<p class="mut favtip">Qui finiscono le bollette che salvi con <b>✓ L\'HO GIOCATA</b>. Gli esiti arrivano in tempo reale da ESPN.<br><br>Lo storico resta solo su questo dispositivo e in questo browser.</p>'), SHOW.find((x) => x[0] === S.show)[1].toLowerCase());
    $("tb-left").textContent = H.length ? "· " + H.length + (H.length === 1 ? " bolletta" : " bollette") : "";
    $("tb-right").textContent = "salvate su questo dispositivo";
    $("kpis").innerHTML = k("GIOCATE", String(H.length), "", dec.length + " decise") + k("VINTE", String(won.length), won.length ? "up" : "", dec.length ? Math.round(100 * won.length / dec.length) + "% delle decise" : "") +
      k("PUNTATO", eur(staked), "", "sulle decise") + k("UTILE", sgn(net), net > 0 ? "up" : net < 0 ? "down" : "", dec.length ? "rendimento " + (staked ? (net >= 0 ? "+" : "") + Math.round(100 * net / staked) + "%" : "—") : "");
    let h = tabs();
    if (!H.length) { $("b-body").innerHTML = h + '<div class="panel"><div class="empty">Nessuna bolletta nello storico.<br>Nella scheda <b>LA BOLLETTA DEL GIORNO</b> tocca <b>✓ L\'HO GIOCATA</b> quando la giochi: qui vedrai se l\'hai vinta e quanto hai guadagnato.</div></div>'; return; }
    const shown = ev.filter((x) => S.show === "all" || (S.show === "open" ? !(x.E.s === "W" || x.E.s === "L") : x.E.s === S.show));
    h += shown.length ? shown.map((x) => histCard(x.b, LV, false)).join("") : '<div class="panel"><div class="empty">Nessuna bolletta in questo gruppo.</div></div>';
    $("b-body").innerHTML = h + '<div class="note">Utile = vincite delle bollette vinte meno gli importi di tutte quelle decise. Le bollette ancora in corso non contano. Una partita rinviata resta "in attesa": toglila con × se serve.</div>';
  }

  function render() {
    if (!on()) return;
    const LV = window.APP.live, U = window.APP.ui;
    if (S.tab === "hist") renderHist(LV, U); else renderDay(LV, U);
  }

  // ---------- azioni ----------
  let toastT = null;
  function toast(msg) { const t = $("toast"); if (!t) return; t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 3200); }
  const num = (t) => Number(String(t.value).replace(",", "."));
  document.addEventListener("change", (e) => {
    if (!on()) return;
    const t = e.target; if (!t || !t.matches) return;
    if (t.matches("[data-bset]")) {
      const f = t.dataset.bset, v = num(t);
      if (f === "n") st().n = v >= 1 && v <= 10 ? Math.round(v) : null;
      else if (f === "qmin") st().qmin = v > 1 ? v : null;
      else if (f === "imp") st().imp = v > 0 ? Math.round(v * 100) / 100 : null;
      save(); render();
    } else if (t.matches("[data-bq]")) {
      const v = num(t); if (v > 1) st().q[t.dataset.bq] = v; else delete st().q[t.dataset.bq]; save(); render();
    }
  });
  document.addEventListener("click", (ev) => {
    if (!on()) return;
    const b = ev.target.closest("[data-bact], [data-act]"); if (!b || !b.closest("#b-body, #side")) return;
    const a = b.dataset.bact || b.dataset.act, c = b.dataset.c;
    if (a === "tab") { S.tab = c; render(); }
    else if (a === "bday") { S.day = c; S.fresh = false; render(); }
    else if (a === "bshow") { S.show = c || "all"; render(); }
    else if (a === "skip") { const L = st().skip[S.day] || []; if (!L.includes(c)) L.push(c); st().skip[S.day] = L; save(); render(); }
    else if (a === "unskip") { delete st().skip[S.day]; save(); render(); }
    else if (a === "fresh") { S.fresh = !S.fresh; render(); }
    else if (a === "play") {
      const B = build(S.day), T = totals(B.legs, B.imp);
      if (!B.legs.length) return;
      st().hist.push({ id: Date.now(), day: S.day, at: Date.now(), imp: B.imp, qt: T.qt, p: T.p,
        legs: B.legs.map((l) => ({ fid: l.f.id, date: l.f.date, time: l.f.time, comp: l.f.comp, home: l.f.home, away: l.f.away, links: slimLinks(l.f.links), m: l.m, q: l.q, src: l.src, est: l.est, safe: l.safe, pick: l.pick })) });
      if (save()) toast("Bolletta salvata nello STORICO BOLLETTE ✓");
      render();
    } else if (a === "del") {
      const i = st().hist.findIndex((x) => String(x.id) === c);
      if (i >= 0 && window.confirm("Tolgo questa bolletta dallo storico?")) { st().hist.splice(i, 1); save(); render(); }
    }
  });
  window.addEventListener("storage", (e) => { if (e.key === KEY) { MEM = null; render(); } });
  // ridisegno ogni minuto (etichette "già iniziata", live) se la scheda è aperta e non stai scrivendo in una casella
  setInterval(() => { const a = document.activeElement; if (on() && !document.hidden && !(a && a.matches && a.matches("input"))) render(); }, 60000);

  window.APP.apps[ME] = { render, close() {} };
  (async function start() {
    let db = null; try { db = await window.APP.use("db"); } catch (e) { db = null; }
    if (!db) { S.ready = true; S.err = "I dati non sono raggiungibili. Ricarica la pagina tra qualche minuto."; render(); return; }
    const docs = (s) => s.docs.map((d) => Object.assign({ id: d.id }, d.data()));
    let got = 0; const done = () => { if (++got >= 2) S.ready = true; render(); };
    const fail = () => { S.ready = true; S.err = "Errore nel leggere i dati. Ricarica la pagina tra qualche minuto."; render(); };
    db.collection("fixtures").onSnapshot((s) => { S.fixtures = docs(s); done(); }, fail);
    db.collection("picks").onSnapshot((s) => { S.picks = docs(s); done(); }, () => done());
  })();
})();
</script>
<script>
(function () {
  "use strict";
  const names = ["bol", "idee", "stats", "classi", "storico", "pref"], alias = { bolletta: "bol", pronostici: "idee", statistiche: "stats", classifiche: "classi", preferiti: "pref" }, box = document.getElementById("app");
  function pick() {
    const h0 = location.hash.replace("#", ""), h = alias[h0] || h0;
    if (names.includes(h)) return h;
    try { const s0 = localStorage.getItem("gold.app"), s = alias[s0] || s0; if (names.includes(s)) return s; } catch (e) { /* niente */ }
    return "idee";
  }
  function mount(name) {
    if (!names.includes(name) || window.APP.active === name || !window.APP.apps[name]) return;
    const prev = window.APP.apps[window.APP.active]; if (prev) prev.close();
    window.APP.active = name;
    box.replaceChildren(document.getElementById("tpl-" + name).content.cloneNode(true));
    document.querySelectorAll("[data-app]").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.app === name)));
    try { localStorage.setItem("gold.app", name); } catch (e) { /* niente */ }
    window.APP.apps[name].render();
    if (window.APP.budget) window.APP.budget.paint();
  }
  // passa a un'altra sezione
  window.APP.go = (name) => {
    const was = window.APP.active; mount(name);
    if (was !== window.APP.active) window.scrollTo(0, 0);
    try { if (location.hash !== "#" + name) location.hash = name; } catch (e) { /* niente */ }
  };
  document.addEventListener("click", (ev) => {
    const b = ev.target.closest("[data-app]"); if (!b) return;
    window.APP.go(b.dataset.app);
    const g = b.dataset.goto; if (g) setTimeout(() => { const t = document.getElementById(g); if (t) t.scrollIntoView({ behavior: "smooth", block: "start" }); }, 60);
  });
  // sul telefono la colonna dei filtri si apre e si chiude con il bottone FILTRI
  document.addEventListener("click", (ev) => {
    const t = ev.target.closest && ev.target.closest("[data-sidetog]"); if (!t) return;
    const s = t.closest(".side"); if (!s) return;
    t.setAttribute("aria-expanded", String(s.classList.toggle("open")));
  });
  window.addEventListener("hashchange", () => mount(pick()));
  mount(pick());
})();
</script>
