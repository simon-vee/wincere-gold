<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wincere Gold · Pronostici e Statistiche</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Tema chiaro e compatto: una barra con le sezioni, intestazione con le azioni, indicatori, grafico + calendario, poi registro a schede. */
:root {
  --bg: #ffffff;
  --panel: #ffffff;
  --panel2: #f6f7f9;
  --line: #e5e7eb;
  --line2: #eef0f3;
  --ink: #1d2433;
  --muted: #6b7280;
  --acc: #2453d4;
  --amber: #b45309;
  --up: #15803d;
  --down: #c62828;
  --r: 8px;
  --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 13px; line-height: 1.45; -webkit-font-smoothing: antialiased; font-feature-settings: "tnum" 1; }
.num { font-variant-numeric: tabular-nums; }
.up { color: var(--up); } .down { color: var(--down); } .amb { color: var(--acc); } .mut { color: var(--muted); }
button, input, select { font: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }

/* barra in alto: nome + selettore delle tre sezioni */
.bar { position: sticky; top: 0; z-index: 40; background: rgba(255, 255, 255, .94); backdrop-filter: saturate(1.4) blur(8px); -webkit-backdrop-filter: saturate(1.4) blur(8px); border-bottom: 1px solid var(--line); }
.bar .in { max-width: 1080px; margin: 0 auto; padding: 8px 16px; display: flex; align-items: center; gap: 16px; }
.brand { font-weight: 700; font-size: 13px; letter-spacing: -.01em; white-space: nowrap; display: flex; align-items: center; gap: 8px; }
.brand i { width: 8px; height: 8px; border-radius: 2px; background: var(--acc); display: inline-block; }
.brand span { color: var(--muted); font-weight: 500; }
.apps { display: flex; gap: 2px; padding: 3px; background: var(--panel2); border: 1px solid var(--line); border-radius: 9px; margin-left: auto; }
.apps button { border: 0; background: transparent; color: var(--muted); padding: 5px 14px; border-radius: 6px; font-weight: 600; font-size: 12.5px; white-space: nowrap; }
.apps button:hover { color: var(--ink); }
.apps button[aria-selected="true"] { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgba(16, 24, 40, .08), 0 0 0 1px var(--line); }

.wrap { max-width: 1080px; margin: 0 auto; padding: 14px 16px 48px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
.wrap > * { min-width: 0; }

.head { display: flex; justify-content: space-between; align-items: center; gap: 10px 16px; flex-wrap: wrap; }
.head h1 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: -.015em; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.head h1 small { font-size: 12px; font-weight: 500; color: var(--muted); letter-spacing: 0; }
.head .sub { color: var(--muted); font-size: 11.5px; margin-top: 1px; }
.head .sub #tb-left:not(:empty)::after { content: " · "; }
.actions { display: flex; flex-wrap: wrap; gap: 6px; }
.btn { border: 1px solid var(--line); background: #fff; color: var(--ink); padding: 6px 11px; font-weight: 600; font-size: 12px; letter-spacing: .01em; border-radius: 7px; }
.btn:hover { border-color: #c9ced6; background: var(--panel2); }
.btn.primary { background: var(--acc); border-color: var(--acc); color: #fff; }
.btn.primary:hover { background: #1d45b5; border-color: #1d45b5; }
.btn.up { color: var(--up); border-color: rgba(21, 128, 61, .35); }
.btn.up:hover { background: rgba(21, 128, 61, .06); }
.btn.down { color: var(--down); border-color: rgba(198, 40, 40, .35); }
.btn.down:hover { background: rgba(198, 40, 40, .06); }
.btn.small { padding: 3px 8px; font-size: 11.5px; border-radius: 6px; }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: var(--panel2); border-color: var(--line); }
.btn.danger.armed { background: var(--down); border-color: var(--down); color: #fff; }
.btn:disabled { opacity: .45; cursor: default; }

.banner { border: 1px solid #f3d19c; background: #fff8eb; color: #8a4b08; padding: 8px 12px; border-radius: var(--r); }
.banner[hidden] { display: none; }

.kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.k { background: #fff; padding: 8px 12px 9px; display: grid; gap: 1px; align-content: start; min-width: 0; }
.k .l { color: var(--muted); font-size: 10px; font-weight: 600; letter-spacing: .07em; }
.k .v { font-size: 16px; font-weight: 700; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.k .n { color: var(--muted); font-size: 10.5px; }

.panel { background: #fff; border: 1px solid var(--line); border-radius: var(--r); min-width: 0; }
.ph { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 6px 12px; min-height: 36px; border-bottom: 1px solid var(--line); color: var(--ink); font-weight: 700; font-size: 10.5px; letter-spacing: .08em; flex-wrap: wrap; }
.ph .r { color: var(--muted); font-weight: 500; letter-spacing: 0; font-size: 11px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 12px; }

.chartpanel { display: flex; flex-direction: column; }
.chart { position: relative; flex: 1 1 auto; height: 210px; min-height: 210px; padding: 6px 4px 0; }
@media (min-width: 761px) { .chart { height: auto; } }
.chart svg { display: block; width: 100%; height: 100%; overflow: visible; }
.chart text { font-family: var(--font); font-size: 10px; fill: var(--muted); }
.chart .endlabel { fill: var(--ink); font-size: 11px; font-weight: 700; }
.tip { position: absolute; pointer-events: none; background: #fff; border: 1px solid var(--line); border-radius: 7px; box-shadow: 0 6px 20px rgba(16, 24, 40, .12); padding: 7px 9px; font-size: 11.5px; min-width: 190px; display: grid; gap: 2px; z-index: 5; }
.tip[hidden] { display: none; }
.tip .t { color: var(--ink); font-weight: 700; }
.tip .r { display: flex; justify-content: space-between; gap: 12px; color: var(--muted); }
.tip .r b { color: var(--ink); font-weight: 700; }
.empty { color: var(--muted); padding: 20px 12px; text-align: center; }

/* calendario */
.cal { padding: 8px 10px 10px; display: grid; gap: 8px; }
.calgrid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; }
.calgrid .dn { color: var(--muted); font-size: 9.5px; font-weight: 600; text-align: center; letter-spacing: .06em; padding-bottom: 1px; }
.day { position: relative; min-height: 38px; background: var(--panel2); border: 1px solid transparent; border-radius: 5px; padding: 3px 4px; display: grid; align-content: space-between; text-align: left; color: var(--muted); font-size: 10px; }
button.day { cursor: pointer; color: var(--ink); }
button.day:hover { border-color: #b8bfca; }
.day.blank { background: transparent; }
.calgrid.tight .day .dv { font-size: 9px; }
.day .dv { font-size: 10px; font-weight: 700; color: inherit; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.day.today { border-color: var(--acc); }
.day.sel { outline: 2px solid var(--ink); outline-offset: -2px; }
.day.open::after { content: ""; position: absolute; right: 3px; top: 3px; width: 6px; height: 6px; background: var(--amber); border-radius: 50%; }
.callegend { display: flex; gap: 12px; flex-wrap: wrap; color: var(--muted); font-size: 10.5px; }
.callegend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; vertical-align: -1px; margin-right: 4px; }

/* da chiudere */
.openrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 7px 12px; border-bottom: 1px solid var(--line2); }
.openrow:last-child { border-bottom: 0; }
.openrow .btns { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.openrow input { width: 92px; }

/* schede */
.tabs { display: flex; gap: 2px; padding: 3px; background: var(--panel2); border: 1px solid var(--line); border-radius: 9px; overflow-x: auto; justify-self: start; max-width: 100%; }
.tab { border: 0; background: transparent; color: var(--muted); padding: 5px 14px; border-radius: 6px; font-weight: 600; font-size: 11.5px; letter-spacing: .05em; white-space: nowrap; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgba(16, 24, 40, .08), 0 0 0 1px var(--line); }

.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; }
th { color: var(--muted); font-weight: 600; font-size: 10px; letter-spacing: .06em; text-align: right; padding: 6px 10px; border-bottom: 1px solid var(--line); background: var(--panel2); white-space: nowrap; }
td { padding: 5px 10px; text-align: right; border-bottom: 1px solid var(--line2); white-space: nowrap; font-variant-numeric: tabular-nums; }
tbody tr:nth-child(even) td { background: #fbfbfc; }
tbody tr:last-child td { border-bottom: 0; }
th.l, td.l { text-align: left; }
tr.click { cursor: pointer; }
tr.click:hover td { background: #f1f5ff; }
tr.dayrow td { background: var(--panel2) !important; color: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: .03em; }
tr.today td { background: #f3f6ff !important; }
.tag { padding: 1px 7px; font-weight: 700; font-size: 10.5px; border-radius: 999px; }
.tag.w { background: #e6f5eb; color: var(--up); }
.tag.l { background: #fcebeb; color: var(--down); }
.tag.o { background: #fdf2e1; color: var(--amber); }
.tag.p { background: #eef0f3; color: var(--muted); }
.filterchip { border: 1px solid var(--acc); color: var(--acc); background: #f3f6ff; padding: 1px 8px; font-size: 11px; font-weight: 600; border-radius: 999px; }

.hb { display: grid; grid-template-columns: minmax(120px, 190px) minmax(0, 1fr) 90px; gap: 10px; align-items: center; padding: 7px 12px; border-bottom: 1px solid var(--line2); }
.hb:last-child { border-bottom: 0; }
.hb .nm { font-weight: 600; overflow-wrap: anywhere; }
.hb .sm { color: var(--muted); font-size: 10.5px; }
.track { position: relative; height: 8px; background: var(--panel2); border-radius: 4px; }
.track .mid { position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--muted); opacity: .5; }
.track .f { position: absolute; top: 0; bottom: 0; border-radius: 4px; }

.adj { padding: 12px; display: grid; gap: 10px; border-top: 1px solid var(--line); }
.adj p { margin: 0; color: var(--muted); }
.adj .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; }
.adj .field { min-width: 160px; flex: 1 1 160px; }

/* fogli */
.overlay { position: fixed; inset: 0; background: rgba(17, 24, 39, .35); display: grid; place-items: center; padding: 16px; z-index: 50; }
.overlay[hidden] { display: none; }
.sheet { background: #fff; border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 20px 50px rgba(16, 24, 40, .2); width: 100%; max-width: 460px; max-height: calc(100% - 8px); overflow-y: auto; display: grid; gap: 11px; padding: 0 0 14px; }
.sheet h3 { margin: 0; padding: 12px 14px 10px; border-bottom: 1px solid var(--line); color: var(--ink); font-size: 13px; letter-spacing: .03em; }
.sheet > :not(h3) { margin: 0 14px; }
.field { display: grid; gap: 4px; }
.field label, .field .lab { font-size: 10px; font-weight: 600; letter-spacing: .07em; color: var(--muted); }
.g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
input, select { color: var(--ink); background: #fff; border: 1px solid #d6dae1; padding: 7px 9px; width: 100%; min-width: 0; border-radius: 6px; }
input:focus, select:focus { border-color: var(--acc); box-shadow: 0 0 0 3px rgba(36, 83, 212, .15); outline: none; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; padding: 3px; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; }
.seg button { border: 0; background: transparent; color: var(--muted); padding: 6px; font-weight: 600; letter-spacing: .04em; border-radius: 5px; }
.seg button[aria-pressed="true"] { background: var(--acc); color: #fff; }
.hint { color: var(--muted); font-size: 11px; }
.err { color: var(--down); font-weight: 700; }
.err:empty { display: none; }
.foot { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.foot .r { display: flex; gap: 8px; margin-left: auto; }

/* selezioni (marcatori) nel modulo */
.legs { display: grid; gap: 8px; }
.leg { border: 1px solid var(--line); background: var(--panel2); border-radius: 7px; padding: 8px; display: grid; gap: 6px; }
.leg .lh { display: flex; justify-content: space-between; align-items: center; gap: 8px; color: var(--ink); font-size: 10.5px; font-weight: 700; letter-spacing: .07em; }
.leg .lh .r { display: flex; gap: 6px; align-items: center; }
.leg .g2 { gap: 6px; }
.hit { border: 1px solid var(--line); background: #fff; color: var(--muted); padding: 3px 8px; font-size: 10.5px; font-weight: 700; letter-spacing: .05em; border-radius: 999px; }
.hit[data-v="1"] { color: var(--up); border-color: rgba(21, 128, 61, .45); background: #e6f5eb; }
.hit[data-v="0"] { color: var(--down); border-color: rgba(198, 40, 40, .45); background: #fcebeb; }
td.sel { white-space: normal !important; min-width: 180px; max-width: 320px; }
td.sel .m { display: block; color: var(--muted); font-size: 10.5px; }
.li .e { grid-column: 1 / -1; color: var(--muted); font-size: 11px; }
.welcome { padding: 14px 12px; display: grid; gap: 10px; }
.welcome p { margin: 0; color: var(--muted); }
.ptable td.l b { font-weight: 700; }

.toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 9px 14px; border-radius: 8px; box-shadow: 0 8px 24px rgba(16, 24, 40, .2); font-weight: 600; z-index: 60; max-width: calc(100% - 32px); }
.toast[hidden] { display: none; }

/* elenco compatto al posto delle tabelle sugli schermi stretti */
.list { display: none; }
.li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; padding: 8px 12px; border-bottom: 1px solid var(--line2); width: 100%; text-align: left; background: transparent; color: var(--ink); border-left: 0; border-right: 0; border-top: 0; }
.li:last-child { border-bottom: 0; }
.li .a { font-weight: 600; overflow-wrap: anywhere; }
.li .b { text-align: right; font-weight: 700; white-space: nowrap; }
.li .c { color: var(--muted); font-size: 11.5px; }
.li .d { text-align: right; }
.li.dayhead { background: var(--panel2); color: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: .03em; padding: 5px 12px; }
.li.dayhead .a { font-weight: 600; }
.li.today { background: #f3f6ff; }

/* freebet, cashout, giocate rimaste aperte dai giorni passati */
.tag.c { background: #e8eefc; color: var(--acc); }
.tag.f { background: #f1ecfb; color: #6d3fc0; }
.openrow.late { box-shadow: inset 3px 0 0 var(--amber); background: #fffaf2; }
.ph .late-n { color: var(--amber); }
.legchips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.chk { display: flex; align-items: center; gap: 7px; font-size: 11.5px; font-weight: 600; letter-spacing: .03em; cursor: pointer; padding: 4px 0; }
.chk input { width: 16px; height: 16px; padding: 0; margin: 0; accent-color: var(--acc); flex: none; box-shadow: none; }
.chk .mut { font-weight: 500; letter-spacing: 0; }
.lg-hist { font-size: 11px; }
.lg-hist:empty { display: none; }

/* menu a tendina di competizione, partita e giocatore (partite e rose caricate da Claude) */
.sheet { position: relative; }
.cb2 { grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); }
#cb-pop { position: absolute; z-index: 5; margin: 0; background: #fff; border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 10px 28px rgba(16, 24, 40, .18); max-height: 270px; overflow-y: auto; padding: 4px; overscroll-behavior: contain; }
#cb-pop[hidden] { display: none; }
.cb-h { font-size: 10px; font-weight: 600; letter-spacing: .07em; color: var(--muted); padding: 7px 8px 3px; position: sticky; top: -4px; background: #fff; }
.cb-o { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; width: 100%; text-align: left; border: 0; background: transparent; padding: 7px 8px; border-radius: 5px; color: var(--ink); font-size: 12.5px; cursor: pointer; }
.cb-o b { font-weight: 700; }
.cb-o .s { color: var(--muted); font-size: 10.5px; white-space: nowrap; }
.cb-o:hover, .cb-o.on { background: #eef2fc; }
.cb-o.cur { box-shadow: inset 3px 0 0 var(--acc); }
.cb-note { padding: 7px 8px; color: var(--muted); font-size: 11.5px; line-height: 1.4; }
.hint.warn { color: var(--amber); font-weight: 600; }
.hint.bad { color: var(--down); font-weight: 600; }

/* budget settimanale */
.budget { border: 1px solid var(--line); border-radius: var(--r); padding: 8px 12px 9px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 5px 14px; align-items: center; background: #fff; }
.budget .bt { font-size: 10.5px; letter-spacing: .07em; white-space: nowrap; }
.budget .bt b { font-weight: 700; }
.budget .bv { text-align: right; font-size: 12px; }
.budget .track2 { grid-column: 1 / -1; height: 6px; background: var(--panel2); border-radius: 3px; overflow: hidden; }
.budget .track2 i { display: block; height: 100%; background: var(--acc); border-radius: 3px; }
.budget.near .track2 i { background: var(--amber); }
.budget.over { border-color: rgba(198, 40, 40, .4); background: #fff7f7; }
.budget.over .track2 i { background: var(--down); }
.budget.none { display: flex; justify-content: space-between; gap: 10px; color: var(--muted); font-size: 12px; padding: 6px 12px; }
.linkbtn { border: 0; background: none; color: var(--acc); font-weight: 600; padding: 0; }
.weeks td.l { font-weight: 600; }

/* idee */
.irow { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 7px 12px; border-bottom: 1px solid var(--line2); }
.irow.nopick { grid-template-columns: minmax(0, 1fr) auto; }
.irow:last-child { border-bottom: 0; }
.irow .pick { width: 16px; height: 16px; padding: 0; margin: 0; accent-color: var(--acc); }
.irow .btns { display: flex; gap: 6px; align-items: center; justify-content: flex-end; flex-wrap: wrap; }
.ibody { border: 0; background: none; text-align: left; padding: 0; color: var(--ink); display: grid; gap: 1px; min-width: 0; }
.ibody b { font-weight: 600; }
.ibody .m { color: var(--muted); font-size: 11px; }
.idayhead { padding: 5px 12px; background: var(--panel2); color: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: .03em; border-bottom: 1px solid var(--line2); }
.ifoot { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 12px; border-top: 1px solid var(--line); background: var(--panel2); border-radius: 0 0 var(--r) var(--r); color: var(--muted); font-size: 11.5px; flex-wrap: wrap; }
.seg.seg3 { grid-template-columns: 1fr 1fr 1fr; }
.conf { font-size: 9.5px; padding: 1px 6px; }

/* pronostici: giorni, schede partita, probabilità, rose */
textarea { font: inherit; color: var(--ink); background: #fff; border: 1px solid #d6dae1; padding: 7px 9px; width: 100%; min-width: 0; border-radius: 6px; resize: vertical; line-height: 1.45; }
textarea:focus { border-color: var(--acc); box-shadow: 0 0 0 3px rgba(36, 83, 212, .15); outline: none; }
.daybar { display: flex; gap: 6px; overflow-x: auto; padding: 1px 1px 3px; scrollbar-width: thin; }
.dchip { border: 1px solid var(--line); background: #fff; color: var(--ink); padding: 5px 11px; border-radius: 999px; font-weight: 600; font-size: 11.5px; letter-spacing: .03em; white-space: nowrap; flex: none; }
.dchip:hover { border-color: #c9ced6; }
.dchip .c { color: var(--muted); font-weight: 600; margin-left: 6px; font-size: 10.5px; }
.dchip[aria-pressed="true"] { background: var(--acc); border-color: var(--acc); color: #fff; }
.dchip[aria-pressed="true"] .c { color: rgba(255, 255, 255, .85); }
.mcards { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 470px), 1fr)); align-items: start; }
.mcard { border: 1px solid var(--line); border-radius: var(--r); background: #fff; padding: 12px 14px; display: grid; gap: 10px; min-width: 0; }
.mcard .mh { display: flex; justify-content: space-between; align-items: center; gap: 4px 12px; flex-wrap: wrap; color: var(--muted); font-size: 11px; }
.mcard .mh b { color: var(--ink); font-weight: 700; letter-spacing: .04em; font-size: 10.5px; }
.mcard .tm { background: var(--ink); color: #fff; border-radius: 5px; padding: 1px 6px; font-weight: 700; margin-right: 7px; font-size: 11.5px; }
.mcard h4 { margin: -2px 0 0; font-size: 16px; font-weight: 700; letter-spacing: -.01em; }
.mcard .tbl { color: var(--muted); font-size: 11.5px; margin-top: -7px; }
.pbar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; gap: 2px; background: var(--panel2); }

// VERSIONE GITHUB: i dati si leggono dai file data/<collezione>.json (li aggiorna Claude); la pagina è in sola lettura
function fileDB() {
  const cache = {};
  // se la lettura non riesce riprova fino a 3 volte; un errore non resta in memoria
  const get = (c, n) => fetch("data/" + c + ".json?v=" + Date.now(), { cache: "no-store" }).then((r) => { if (!r.ok) throw new Error(String(r.status)); return r.json(); })
    .catch((e) => (n > 0 ? new Promise((res) => setTimeout(res, 700)).then(() => get(c, n - 1)) : Promise.reject(e)));
  const load = (c) => cache[c] || (cache[c] = get(c, 3).catch((e) => { delete cache[c]; throw e; }));
  const snap = (rows) => ({ docs: rows.map((o) => { const rest = Object.assign({}, o); delete rest.id; return { id: o.id, data: () => Object.assign({}, rest) }; }) });
  const ro = () => Promise.reject(Object.assign(new Error("sola lettura"), { code: "not_granted" }));
  const doc = () => ({ set: ro, update: ro, delete: ro });
  return { collection: (c) => ({ onSnapshot(ok, err) { load(c).then((rows) => ok(snap(rows)), (e) => { if (err) err(e); }); return () => {}; }, doc }) };

<script>
// CALENDARIO E ROSE: partite (fixtures/*) e giocatori (squads/*) caricati da Claude.
// I campi con data-cb="comp|match|player" dei moduli aprono un menu: competizioni del giorno → partite di quella competizione → giocatori delle due squadre.
(function () {
  "use strict";
  const C = { fixtures: [], squads: new Map() };
  const P = { inp: null, opts: [], act: -1, typed: false, silent: false };
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const SP = { "Ø": "O", "ø": "o", "Æ": "AE", "æ": "ae", "Þ": "TH", "þ": "th", "Ð": "D", "ð": "d", "ß": "SS", "Ł": "L", "ł": "l", "Đ": "D", "đ": "d", "ı": "i", "Œ": "OE", "œ": "oe" };
  const plain = (s) => String(s || "").replace(/[ØøÆæÞþÐðßŁłĐđıŒœ]/g, (c) => SP[c]).normalize("NFD").replace(/[̀-ͯ]/g, "").toUpperCase().replace(/\s+/g, " ").trim();
  const norm = (s) => plain(s).replace(/\s*-\s*/g, " - ");
  const key = (team) => plain(team).replace(/[^A-Z0-9]+/g, "_").replace(/^_+|_+$/g, "");
  const matchOf = (f) => norm(f.home) + " - " + norm(f.away);
  const short = (iso) => (iso ? iso.slice(8) + "/" + iso.slice(5, 7) : "");
  const byTime = (a, b) => String(a.time || "").localeCompare(String(b.time || "")) || matchOf(a).localeCompare(matchOf(b));
  const onDate = (date) => C.fixtures.filter((f) => f.date === date).sort(byTime);
  function findFixture(date, match) {
    const m = norm(match); if (!m) return null;
    return onDate(date).find((f) => matchOf(f) === m) || C.fixtures.find((f) => matchOf(f) === m) || null;
  }
  const pval = (p) => plain((p.n ? p.n + " " : "") + p.s);

  function playersOf(f) {
    const out = [];
    [f.home, f.away].forEach((t) => { const sq = C.squads.get(key(t)); if (sq) (sq.players || []).forEach((p) => out.push({ s: p.s || "", n: p.n || "", r: p.r || "", team: plain(t) })); });

  }
  function ctx(inp) {
    const sh = inp.closest(".sheet"), g = inp.closest(".leg") || sh, d = sh && sh.querySelector("#f-date, #i-date");
    const get = (k) => (g ? g.querySelector('[data-cb="' + k + '"]') : null);
    return { date: d ? d.value : "", comp: get("comp"), match: get("match"), player: get("player") };
  }
  const histOf = (inp) => Array.from(document.querySelectorAll("#" + (inp.dataset.hist || "x") + " option")).map((o) => o.value).filter(Boolean);
  const noDate = (date) => (date ? "Nessuna partita caricata per il " + short(date) + ". Scrivi a mano, oppure chiedi a Claude di caricare le partite di quel giorno." : "Scegli prima la data.");

  // opzioni del menu: prima quelle del calendario, poi (se scrivi o se il calendario è vuoto) i nomi già usati in passato
  function build(inp, q) {

    const addHist = (exclude, hasCal) => {

      const comps = [];

      if (!day.length) note = noDate(c.date);

    } else if (kind === "match") {
      const cv = norm(c.comp ? c.comp.value : ""), inComp = day.filter((f) => norm(f.comp) === cv), list = inComp.length ? inComp : day;
      const items = fil(list, (f) => matchOf(f) + " " + norm(f.comp)).map((f) => ({ v: matchOf(f), html: esc(matchOf(f)), sub: [f.time, inComp.length ? "" : norm(f.comp)].filter(Boolean).join(" · "), f }));

      if (items.length) groups.push({ h: "GIOCATORI · " + matchOf(f), items });
      else if (f && !ps.length) note = "Rose di " + matchOf(f) + " non ancora caricate: scrivi il nome a mano.";
      else if (!f && !(c.match && c.match.value.trim())) note = "Scegli prima la partita: qui compariranno i giocatori delle due squadre.";

  function popEl(inp) {
    const sh = inp.closest(".sheet"); let el = $("cb-pop");

  }

      h += '<div class="cb-h">' + esc(g.h) + "</div>";
      g.items.forEach((o) => { const i = P.opts.push(o) - 1; h += '<button type="button" tabindex="-1" role="option" class="cb-o' + (plain(o.v) === cur ? " cur" : "") + '" data-cbi="' + i + '"><span>' + o.html + "</span>" + (o.sub ? '<span class="s">' + esc(o.sub) + "</span>" : "") + "</button>"; });
    });
    if (!h) { const el = $("cb-pop"); if (el) { el.hidden = true; el.innerHTML = ""; } return; }
    const el = popEl(inp); el.innerHTML = h; el.hidden = false; el.scrollTop = 0; place();
  }

    const el = $("cb-pop"); if (!el || el.hidden || !P.inp) return;

    const w = Math.min(b.width - 16, Math.max(a.width, 270)); let left = a.left - b.left - sh.clientLeft;
    if (left + w > b.width - 8) left = Math.max(8, b.width - 8 - w);
    el.style.top = a.bottom - b.top - sh.clientTop + sh.scrollTop + 3 + "px"; el.style.left = left + "px"; el.style.width = w + "px";
  }
  function hide() { const el = $("cb-pop"); if (el) { el.hidden = true; el.innerHTML = ""; } P.inp = null; P.opts = []; P.act = -1; }
  function setv(inp, v) { if (!inp || inp.value === v) return; inp.value = v; inp.dispatchEvent(new Event("input", { bubbles: true })); }

    setv(inp, o.v);
    if (kind === "comp") {
      const list = onDate(c.date).filter((f) => norm(f.comp) === o.v), m = c.match ? c.match.value.trim() : "";
      if (list.length && m && !list.some((f) => matchOf(f) === norm(m))) { setv(c.match, ""); setv(c.player, ""); }
      next = c.match;
    } else if (kind === "match") {
      if (o.f) {
        setv(c.comp, norm(o.f.comp));
        const ps = playersOf(o.f).map(pval), pv = c.player ? c.player.value.trim() : "";

    el.querySelectorAll(".cb-o").forEach((b) => b.classList.toggle("on", Number(b.dataset.cbi) === P.act));

  }

  document.addEventListener("input", (ev) => { const t = ev.target; if (P.silent || !isCb(t) || document.activeElement !== t) return; P.typed = true; show(t); });

  document.addEventListener("mousedown", (ev) => { if (ev.target.closest && ev.target.closest("#cb-pop")) ev.preventDefault(); });

  (async function start() {
    let db = null; try { db = await window.APP.use("db"); } catch (e) { db = null; }
    if (!db) return;

(function () {

  const ME = "live";

  // Ogni 30 secondi rilegge solo i campionati con partite iniziate oggi e non ancora finite. Lo STORICO resta quello salvato da Claude.
  const SLUG = { "SERIE A": "ita.1", "SERIE B": "ita.2", "COPPA ITALIA": "ita.coppa_italia", "PREMIER LEAGUE": "eng.1", "CHAMPIONSHIP": "eng.2", "LEAGUE ONE": "eng.3", "FA CUP": "eng.fa", "COPPA DI LEGA": "eng.league_cup",

    "COPPA DI FRANCIA": "fra.coupe_de_france", "EREDIVISIE": "ned.1", "PRIMEIRA LIGA": "por.1", "BRASILE SERIE A": "bra.1", "CHAMPIONS LEAGUE": "uefa.champions", "EUROPA LEAGUE": "uefa.europa", "CONFERENCE LEAGUE": "uefa.europa.conf",
    "CHAMPIONS LEAGUE FEMMINILE": "uefa.wchampions", "NATIONS LEAGUE": "uefa.nations", "QUALIFICAZIONI MONDIALI": "fifa.worldq.uefa", "QUALIFICAZIONI EUROPEI": "uefa.euroq", "AMICHEVOLI": "fifa.friendly", "SUPERCOPPA ITALIANA": "ita.super_cup",
    "LEAGUE TWO": "eng.4", "PREMIERSHIP SCOZZESE": "sco.1", "CHAMPIONSHIP SCOZZESE": "sco.2", "PRO LEAGUE BELGA": "bel.1", "SUPER LIG TURCA": "tur.1", "SUPER LEAGUE GRECA": "gre.1",
    "BUNDESLIGA AUSTRIACA": "aut.1", "SUPERLIGA DANESE": "den.1", "EERSTE DIVISIE": "ned.2" };
  const SP = { "Ø": "O", "ø": "o", "Æ": "AE", "æ": "ae", "ß": "SS", "Ł": "L", "ł": "l", "ı": "i", "Œ": "OE", "œ": "oe", "Đ": "D", "đ": "d" };
  const plain = (s) => String(s || "").replace(/[ØøÆæßŁłıŒœĐđ]/g, (c) => SP[c]).normalize("NFD").replace(/[̀-ͯ]/g, "").toUpperCase().replace(/[^A-Z0-9]+/g, " ").trim();

  (async function start() {

  const S = { data: null, err: "", idx: new Map(), byCode: new Map(), next: new Map(), evs: [], fixtures: [], ready: false, tab: "partite", day: null, mk: "cb", league: "ALL", comp: "", sample: "l", open: new Set(),

  ];
  const RE = new Set(["rx", "r1", "r2"]), RSG = { rx: ["0-0", "1-1"], r1: ["1-0", "2-0", "2-1"], r2: ["0-1", "0-2", "1-2"] };
  // gruppi delle giocate: MULTIBET PRIMO TEMPO (1 PT o Over 1,5 PT) ed ESITI PRIMO TEMPO (tutte le altre)
  const GRP = [["mb", "MULTIBET PRIMO TEMPO", ["cb"]], ["es", "ESITI PRIMO TEMPO", ["w1", "sc", "o05", "o15", "m13", "m14"]], ["mp", "MULTIBET PARTITA", ["c2"]], ["st", "ESITI SECONDO TEMPO", ["s05"]], ["re", "RISULTATI ESATTI", ["rx", "r1", "r2"]]];
  const grpOf = (id) => (GRP.find((g) => g[2].includes(id)) || GRP[1])[0];
  // riga sopra le colonne delle giocate: before/after = quante colonne ci sono prima e dopo

  const SH = { cb: "1 PT O OV 1,5", w1: "1 PT", sc: "CASA SEGNA PT", o05: "OVER 0,5 PT", o15: "OVER 1,5 PT", m13: "MG 1-3 PT", m14: "MG 1-4 PT", c2: "COMBO PT+2T", s05: "OVER 0,5 2T", rx: "0-0 / 1-1", r1: "1-0 / 2-0 / 2-1", r2: "0-1 / 0-2 / 1-2" };
  const mkOf = (id) => MK.find((m) => m[0] === id) || MK[0];
  const blk = (team, side) => { if (!team) return null; const x = team[side] || {}; const b = x[S.sample]; return b && b[0] ? b : (x.s && x.s[0] ? x.s : null); };
  const rate = (num, n) => (n ? num / n : null);

  function est(H, A, m) {
    const hb = blk(H, "h"), ab = blk(A, "a"), hr = hb ? rate(m[3](hb), hb[0]) : null, ar = ab ? rate(m[4](ab), ab[0]) : null;

  const U = window.APP.ui, FL = (c) => U.flag(c) + " ";

  window.APP.stats = { raw: () => S.data, err: () => S.err, cal: () => (S.data ? S.data.cal : null), names: MKL, ids: () => MK.map((m) => m[0]), sample: () => S.sample, myMin, minN };
  (async function start() {
    try {
      const r = await fetch("stats.json", { cache: "no-store" });
      if (!r.ok) throw new Error(String(r.status));
      S.data = await r.json(); index();
    } catch (e) { S.err = "Statistiche non disponibili: chiedi a Claude di aggiornarle."; }
    document.dispatchEvent(new Event("gold-stats"));  // per la sezione Classifiche
    render();
    let db = null; try { db = await window.APP.use("db"); } catch (e) { db = null; }
    if (!db) { S.ready = true; render(); return; }
    db.collection("fixtures").onSnapshot((s) => { S.fixtures = s.docs.map((d) => Object.assign({ id: d.id }, d.data())); S.ready = true; render(); }, () => { S.ready = true; render(); });
  })();
})();
</script>
<script>
(function () {
  "use strict";
  const ME = "storico", on = () => window.APP.active === ME;
  // STORICO: tutte le partite pronosticate (fino a oggi) con l'esito di ogni pronostico e marcatore. Solo lettura: gli esiti si segnano nei Pronostici.
  //  picks/* { date, time, comp, match, market, conf, prob, why, odds, hit, result "2-1", ht "1-0" }   ideas/* { date, time?, comp, match, player, conf, prob, why, odds, hit, result }
  const S = { picks: [], ideas: [], fixtures: [], ready: { picks: false, ideas: false }, err: "", period: "all", res: "all", kinds: new Set(), comps: new Set(), group: "kind", open: new Set(), limit: 80 };

  // ---------- utilità ----------
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const SP = { "Ø": "O", "ø": "o", "Æ": "AE", "æ": "ae", "Þ": "TH", "þ": "th", "Ð": "D", "ð": "d", "ß": "SS", "Ł": "L", "ł": "l", "Đ": "D", "đ": "d", "ı": "i", "Œ": "OE", "œ": "oe" };
  const plain = (s) => String(s || "").replace(/[ØøÆæÞþÐðßŁłĐđıŒœ]/g, (c) => SP[c]).normalize("NFD").replace(/[̀-ͯ]/g, "").toUpperCase().replace(/\s+/g, " ").trim();
  const norm = (s) => plain(s).replace(/\s*-\s*/g, " - ");
  const up = (s) => String(s || "").trim().replace(/\s+/g, " ").toUpperCase();
  const pad = (n) => String(n).padStart(2, "0");
  const isoOf = (d) => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  const todayISO = () => isoOf(new Date());
  const toDate = (iso) => { const [y, m, d] = String(iso).split("-").map(Number); return new Date(y, (m || 1) - 1, d || 1); };
  const addDays = (iso, n) => { const d = toDate(iso); d.setDate(d.getDate() + n); return isoOf(d); };
  const dm = (iso) => String(iso).slice(8, 10) + "/" + String(iso).slice(5, 7);
  const longDay = new Intl.DateTimeFormat("it-IT", { weekday: "long", day: "numeric", month: "long" });
  const pctF = new Intl.NumberFormat("it-IT", { style: "percent", maximumFractionDigits: 0 });
  const pct = (n) => pctF.format(n || 0);
  const nf = new Intl.NumberFormat("it-IT", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const NIGHT = "06:00";
  const vdayOf = (date, time) => (time && time < NIGHT ? addDays(date, -1) : date);
  const CONF = ["alta", "media", "bassa"], confTxt = { alta: "ALTA", media: "MEDIA", bassa: "BASSA" }, confCls = { alta: "w", media: "o", bassa: "l" };
  const confTag = (c) => '<span class="tag conf ' + (confCls[c] || "p") + '" title="fiducia">' + (confTxt[c] || "—") + "</span>";
  const hasProb = (p) => p !== null && p !== undefined && p !== "" && Number.isFinite(Number(p));
  const SC = "MARCATORI";
  const kindOf = (o) => (o.t === "i" ? SC : /passa il turno/i.test(o.market || "") ? "PASSA IL TURNO" : up(o.market) || "ALTRO");
  function banner(msg) { S.err = msg || ""; const b = $("banner"); if (!on() || !b) return; b.textContent = S.err; b.hidden = !S.err; }

  // ---------- calcoli ----------
  function items() {
    const fx = new Map(S.fixtures.map((f) => [f.date + "|" + norm(f.home) + " - " + norm(f.away), f])), today = todayISO();
    const mk = (t) => (x) => {
      const f = fx.get(x.date + "|" + norm(x.match)), time = x.time || (f && f.time) || "";
      const o = Object.assign({}, x, { t, time, vday: vdayOf(x.date, time), match: norm(x.match), comp: norm(x.comp || (f && f.comp) || ""), hit: x.hit === true || x.hit === false ? x.hit : null });
      o.kind = kindOf(o); return o;
    };
    return [].concat(S.picks.map(mk("p")), S.ideas.map(mk("i"))).filter((o) => o.match && /^\d{4}-\d{2}-\d{2}$/.test(o.vday || "") && o.vday <= today);
  }
  const fromOf = () => (S.period === "7" ? addDays(todayISO(), -6) : S.period === "30" ? addDays(todayISO(), -29) : "");
  const inPeriod = (all) => { const from = fromOf(); return from ? all.filter((o) => o.vday >= from) : all; };
  const filtered = (all) => inPeriod(all).filter((o) => (!S.kinds.size || S.kinds.has(o.kind)) && (!S.comps.size || S.comps.has(o.comp)) &&
    (S.res === "all" || (S.res === "ok" ? o.hit === true : S.res === "ko" ? o.hit === false : o.hit === null)));
  function agg(list) {
    const k = list.filter((o) => o.hit !== null), ok = k.filter((o) => o.hit).length, wp = k.filter((o) => hasProb(o.prob));
    return { n: list.length, known: k.length, ok, ko: k.length - ok, wait: list.length - k.length, rate: k.length ? ok / k.length : 0, nProb: wp.length, avgProb: wp.length ? wp.reduce((s, o) => s + Number(o.prob), 0) / wp.length / 100 : 0 };
  }
  const isP = (o) => o.t === "p", isI = (o) => o.t === "i";
  // SE AVESSI GIOCATO (dal 25/11/2026, chiesto dall'utente): 1 € su ogni pronostico finito, alla quota scritta, se no a quella del bookmaker
  // salvata dai controlli (chk.qbook), se no a quella stimata (chk.qest). Le quote sotto 1,01 non si possono giocare: escluse.
  const qOf = (o) => { const c = o.chk || {}, q = Number(o.odds) || Number(c.qbook) || Number(c.qest) || 0; return q >= 1.01 ? q : 0; };
  const realQ = (o) => !!(Number(o.odds) || Number((o.chk || {}).qbook));
  function money(list) {
    const l = list.filter((o) => isP(o) && o.hit !== null && qOf(o)), ok = l.filter((o) => o.hit).length;
    return { n: l.length, ok, net: l.reduce((s, o) => s + (o.hit ? qOf(o) - 1 : -1), 0), avg: l.length ? l.reduce((s, o) => s + qOf(o), 0) / l.length : 0, real: l.filter(realQ).length };
  }
  const eur = (x) => (x > 0.004 ? "+" : x < -0.004 ? "−" : "") + nf.format(Math.abs(x)) + " €";
  function moneyBox(F) {
    const done = F.filter((o) => isP(o) && o.hit !== null), m = money(F), out = done.length - m.n;
    const head = '<div class="panel hmoney"><div class="ph"><span>SE AVESSI GIOCATO</span><span class="r mut">1 € su ogni pronostico finito</span></div>';
    if (!m.n) return head + '<div class="empty">Nessun pronostico finito con una quota, con questi filtri. Le quote si salvano dal 23/11.</div></div>';
    const rate = m.ok / m.n, need = 1 / m.avg, sk = (l, v, cls, n) => '<div class="bsk' + (cls ? " " + cls : "") + '"><span class="l">' + l + '</span><span class="v num">' + v + '</span>' + (n ? '<span class="n">' + n + "</span>" : "") + "</div>";
    const cls = m.net > 0.004 ? "up" : m.net < -0.004 ? "down" : "";
    return head + '<div class="bsum">' +
      sk("GIOCATI", String(m.n), "", m.real + " con quota vera · " + (m.n - m.real) + " stimata") +
      sk("PRESI", pct(rate), rate >= need ? "up" : "down", m.ok + " su " + m.n) +
      sk("QUOTA MEDIA", nf.format(m.avg), "", "") +
      sk("PER NON PERDERE", pct(need), "", "pronostici da prendere") +
      sk("PUNTATO", nf.format(m.n) + " €", "", "") +
      sk("UTILE", eur(m.net), cls, "rendimento " + (m.net >= 0 ? "+" : "−") + pctF.format(Math.abs(m.net / m.n))) + "</div>" +
      '<div class="bjud"><span>' + (rate >= need ? "Hai preso il <b>" + pct(rate) + "</b>: più del " + pct(need) + " che serve con queste quote. <b>Il metodo sta guadagnando.</b>"
        : "Hai preso il <b>" + pct(rate) + "</b>, ma con una quota media di " + nf.format(m.avg) + " per non perdere serviva il <b>" + pct(need) + "</b>. <b>Indovinare tanto non basta: le quote sono troppo basse.</b>") + "</span></div>" +
      '<div class="hint hnote">Quota usata: quella scritta, se no quella del bookmaker, se no quella stimata (~). Contano solo i pronostici, non i marcatori.' +
      (out ? " Esclusi " + out + (out === 1 ? " pronostico finito" : " pronostici finiti") + " senza quota (di prima del 23/11) o con quota sotto 1,01." : "") + "</div></div>";
  }
  function matches(F, all) {
    const res = new Map(), m = new Map(), kk = (o) => o.vday + "|" + o.match;
    for (const o of all) { const r = res.get(kk(o)) || {}; if (o.result && !r.result) r.result = String(o.result); if (o.ht && !r.ht) r.ht = String(o.ht); res.set(kk(o), r); }
    for (const o of F) {
      if (!m.has(kk(o))) m.set(kk(o), Object.assign({ k: kk(o), vday: o.vday, date: o.date, time: o.time, comp: o.comp, match: o.match, items: [] }, res.get(kk(o))));
      const g = m.get(kk(o)); g.items.push(o); if (!g.comp && o.comp) g.comp = o.comp; if (!g.time && o.time) { g.time = o.time; g.date = o.date; }
    }
    const order = (o) => (o.t === "p" ? 0 : 1) * 10 + CONF.indexOf(o.conf);
    const list = Array.from(m.values()); list.forEach((g) => g.items.sort((a, b) => order(a) - order(b) || (Number(b.prob) || 0) - (Number(a.prob) || 0)));
    return list.sort((a, b) => b.vday.localeCompare(a.vday) || (a.date + (a.time || "99")).localeCompare(b.date + (b.time || "99")) || a.match.localeCompare(b.match));
  }

  // ---------- disegno ----------
  const k = (l, v, c, n) => '<div class="k"><span class="l">' + l + '</span><span class="v num ' + (c || "") + '" title="' + esc(v) + '">' + v + '</span>' + (n ? '<span class="n">' + n + "</span>" : "") + "</div>";
  const rateCls = (x, hi, lo) => (!x.known ? "" : x.rate >= hi ? "up" : x.rate < lo ? "down" : "");
  function render() {
    if (!on()) return;
    const all = items(), F = filtered(all), M = matches(F, all), P = agg(F.filter(isP)), I = agg(F.filter(isI));
    const days = Array.from(new Set(all.map((o) => o.vday))).sort();
    $("tb-left").textContent = days.length ? "· dal " + dm(days[0]) + " al " + dm(days[days.length - 1]) : "";
    $("tb-right").textContent = M.length + (M.length === 1 ? " partita" : " partite") + " · " + P.n + " pronostici · " + I.n + " marcatori";
    // la giocata che funziona meglio: almeno 3 esiti
    const byKind = new Map(); F.filter(isP).forEach((o) => { if (!byKind.has(o.kind)) byKind.set(o.kind, []); byKind.get(o.kind).push(o); });
    const best = Array.from(byKind.entries()).map(([kk, l]) => Object.assign({ kk }, agg(l))).filter((x) => x.known >= 3).sort((a, b) => b.rate - a.rate || b.known - a.known)[0];
    const wait = F.filter((o) => o.hit === null).length;
    $("kpis").innerHTML = k("PRONOSTICI PRESI", P.known ? pct(P.rate) : "—", rateCls(P, 0.65, 0.5), P.known ? P.ok + " su " + P.known + (P.nProb ? " · stima " + pct(P.avgProb) : "") : "nessuno verificato") +
      k("MARCATORI A SEGNO", I.known ? pct(I.rate) : "—", rateCls(I, 0.4, 0.2), I.known ? I.ok + " su " + I.known + (I.nProb ? " · stima " + pct(I.avgProb) : "") : "nessuno verificato") +
      k("PARTITE", String(M.length), "", new Set(M.map((g) => g.vday)).size + " giorni") +
      k("GIOCATA MIGLIORE", best ? esc(best.kk) : "—", "", best ? best.ok + " su " + best.known + " · " + pct(best.rate) : "servono almeno 3 esiti") +
      k("IN ATTESA", String(wait), "", wait ? "da verificare" : "tutto verificato");
    banner(S.err);
    $("side").innerHTML = all.length ? sideHtml(all) : "";
    if (!(S.ready.picks && S.ready.ideas)) { $("h-body").innerHTML = '<div class="panel"><div class="empty">CARICAMENTO…</div></div>'; return; }
    if (!all.length) { $("h-body").innerHTML = '<div class="panel"><div class="empty">Ancora nessun pronostico nello storico.</div></div>'; return; }
    $("h-body").innerHTML = moneyBox(F) + summary(F) + table(F, all);
  }
  const seg = (act, cur, opts) => '<div class="seg sseg" role="group" style="grid-template-columns:repeat(' + opts.length + ',auto)">' + opts.map(([v, l]) => '<button type="button" data-act="' + act + '" data-v="' + v + '" aria-pressed="' + (cur === v) + '">' + l + "</button>").join("") + "</div>";
  // colonna dei filtri: periodo, esito, giocata, campionati (con bandiera)
  const U = window.APP.ui;
  function sideHtml(all) {
    const P = inPeriod(all), count = (f) => { const m = new Map(); P.forEach((o) => m.set(f(o), (m.get(f(o)) || 0) + 1)); return m; };
    const kinds = count((o) => o.kind), comps = count((o) => o.comp);
    const kl = Array.from(kinds.keys()).sort((a, b) => (a === SC) - (b === SC) || kinds.get(b) - kinds.get(a) || a.localeCompare(b));
    const cl = Array.from(comps.keys()).filter(Boolean).sort(U.compOrder).map((c) => ({ c, n: comps.get(c) }));
    const any = S.period !== "all" || S.res !== "all" || S.kinds.size || S.comps.size;
    const html = U.group("PERIODO", U.pills("hper", [["all", "Tutto"], ["7", "Ultimi 7 giorni"], ["30", "Ultimi 30 giorni"]], (v) => S.period === v)) +
      U.group("ESITO", U.pills("hres", [["all", "Tutti"], ["ok", "✓ Presi"], ["ko", "✗ Persi"], ["wait", "In attesa"]], (v) => S.res === v)) +
      U.group("GIOCATA", U.pills("hkind", [["", "Tutte"]].concat(kl.map((x) => [x, esc(x) + ' <span class="mut">' + kinds.get(x) + "</span>"])), (v) => (v ? S.kinds.has(v) : !S.kinds.size))) +
      U.group('CAMPIONATI <span class="mut">· giocate</span>', U.leagues(cl, S.comps, "hcomp")) +
      (any ? '<div><button type="button" class="btn small" data-act="hreset">TOGLI I FILTRI</button></div>' : "");
    return U.side(html, (S.period === "all" ? "tutto lo storico" : "ultimi " + S.period + " giorni") + (any ? " · filtri attivi" : ""));
  }
  const GROUPS = [["kind", "PER GIOCATA"], ["conf", "PER FIDUCIA"], ["safe", "PER BOLLINO"], ["comp", "PER CAMPIONATO"], ["day", "PER GIORNO"]];
  // PER BOLLINO (dal 23/11): i pronostici con la lista dei controlli, SICURI o no, e quelli di prima
  const SAFE = ["SICURO", "NON SICURO", "SENZA LISTA DEI CONTROLLI", SC];
  const safeOf = (o) => (o.t === "i" ? SC : !o.chk ? "SENZA LISTA DEI CONTROLLI" : o.chk.safe ? "SICURO" : "NON SICURO");
  function summary(F) {
    const keyOf = { conf: (o) => o.conf || "", kind: (o) => o.kind, safe: safeOf, comp: (o) => o.comp || "—", day: (o) => o.vday }[S.group];

    const label = (kk) => (S.group === "safe" && kk === "SICURO" ? '<span class="tag safe">SICURO</span>' : S.group === "conf" ? "FIDUCIA " + (confTxt[kk] || "—") : S.group === "day" ? longDay.format(toDate(kk)) : S.group === "comp" ? U.flag(kk) + " " + esc(U.tc(kk)) : esc(kk));

      '<div class="scroll"><table class="stab hsum"><thead><tr><th class="l"></th><th>PRONOSTICI PRESI</th><th>%</th><th title="probabilità media stimata da Claude">STIMA</th><th title="se avessi giocato 1 € su ogni pronostico con quota">UTILE 1 €</th><th>MARCATORI A SEGNO</th><th>%</th><th title="probabilità media stimata da Claude">STIMA</th></tr></thead><tbody>' +

      '</tbody></table></div><div class="hint hnote">STIMA = probabilità media che Claude aveva dato. Se la % reale è più alta, le stime erano prudenti; se è più bassa, erano troppo ottimiste. UTILE 1 € = quanto avresti vinto o perso giocando 1 € su ogni pronostico con quota.</div></div>';
  }
  // TUTTE LE GIOCATE: una riga per giocata, divise per giorno (dal più recente); tocca una riga per il motivo
  const confLow = (c) => (confTxt[c] ? confTxt[c].charAt(0) + confTxt[c].slice(1).toLowerCase() : "—");

  }

    let h = '<div class="panel" style="border:0;background:none"><div class="ph" style="border:0;padding:0 2px 6px"><span>TUTTE LE GIOCATE (' + rows.length + ')</span><span class="r">tocca una riga per rileggere il motivo</span></div>';
    if (!rows.length) return h + '<div class="gtw"><div class="empty">Nessuna giocata con questi filtri. <button type="button" class="linkbtn" data-act="hreset">Togli i filtri</button></div></div></div>';
    const shown = rows.slice(0, S.limit);
    h += '<div class="gtw"><table class="gt"><thead><tr><th>ORA</th><th>CAMPIONATO</th><th>CASA</th><th>OSPITE</th><th class="c">PT</th><th class="c">FIN</th><th>GIOCATA</th><th>FIDUCIA</th><th class="r">PROB</th><th class="r">QUOTA</th><th class="r">ESITO</th></tr></thead><tbody>';
    let cur = null;
    for (const o of shown) {
      if (o.vday !== cur) {
        cur = o.vday;

        '<td class="ch"><span class="chipsm">' + chips + '</span></td><td class="r ed"><button type="button" class="btn small" data-fav="' + esc(JSON.stringify({ m: slim(f), s: [] })) + '">MODIFICA</button></td></tr>';
    }
    $("p-body").innerHTML = h + '</tbody></table></div><div class="note">Durante la partita la pagina si aggiorna da sola ogni 30 secondi. ' + LV.tag("W") + " e " + LV.tag("L") + " = deciso · " + LV.tag("w") + " e " + LV.tag("l") + " = com'è adesso, può ancora cambiare · " + LV.tag("n") + " = si decide più avanti · grigio = partita non ancora iniziata.</div>";
  }
  document.addEventListener("click", (ev) => {
    if (!on()) return;
    const b = ev.target.closest("[data-act]"); if (!b || !b.closest("#p-body, #side")) return;
    const a = b.dataset.act;
    if (a === "fshow") { S.show = b.dataset.c || "all"; render(); }
    else if (a === "fclear") {
      const t = today(), LV = window.APP.live, keep = load().filter((f) => { const L = LV ? LV.get(item(f)) : null; return stateOf(f, L, t) !== "post"; });

    }
  });

  window.APP.fav = { star, open: openSheet };
  window.APP.apps[ME] = { render, close() { closeSheet(); } };
})();

<script>
/* IL CONSIGLIO di Pronostici (dal 23/11/2026): se giocare, cosa, come e quanto puntare.
   Usa la lista dei controlli (picks.chk) e le giocate provate per ogni partita (fixtures.adv, da controlli.py).
   Cassa, quota minima personale e quote scritte dall'utente restano solo nel browser (localStorage "gold.cassa").
   Quota: quella scritta dall'utente, se no quella vera del bookmaker (1X2, Over/Under), se no la QUOTA PROBABILE
   ricavata dalle quote del bookmaker (controlli.py, margine 8%).
   Conviene solo se la quota è almeno: quota minima (100/stima) + 3% di margine, e almeno la quota minima personale (di partenza 1,20).
   Puntata: un quarto del metodo di Kelly, al massimo 5% della cassa (GIOCA) o 2% (GIOCA PICCOLO); limite del giorno 10%. */
(function () {
  const ME = "consiglio", KEY = "gold.cassa";
  const MAX_GO = 0.05, MAX_SMALL = 0.02, MAX_DAY = 0.10, EDGE = 1.03, MY_MIN = 1.20;
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const nf = new Intl.NumberFormat("it-IT", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const q2 = (n) => nf.format(Math.round(Number(n) * 100) / 100);
  const eur = (n) => nf.format(n) + " €";
  let MEM = null;
  const DAYF = {};  // giorno -> fattore per restare nel limite del 10% al giorno (calcolato dalla barra di GIOCATE)
  function st() {
    if (MEM) return MEM;
    try { MEM = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { MEM = {}; }
    if (!MEM.q || typeof MEM.q !== "object") MEM.q = {};
    return MEM;
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(st())); } catch (e) { /* niente */ } }
  const cassa = () => (Number(st().cassa) > 0 ? Number(st().cassa) : 0);
  const myMin = () => (Number(st().qmu) > 1 ? Number(st().qmu) : MY_MIN);
  const userQ = (k) => (Number(st().q[k]) > 1 ? Number(st().q[k]) : 0);

  // dati comuni di un pronostico (picks) o di una giocata provata (fixtures.adv)
  function fromPick(x) {
    const c = x.chk || {};
    return { key: "p:" + x.id, m: x.market, est: c.est !== null && c.est !== undefined && Number.isFinite(Number(c.est)) ? Number(c.est) : null, safe: !!c.safe, no: Number(c.no) || 0,
      qmin: Number(c.qmin) || 0, qb: Number(c.qbook) > 1 ? Number(c.qbook) : Number(x.odds) > 1 ? Number(x.odds) : 0, qby: Number(c.qbook) > 1 ? c.qby || "bookmaker" : "quota segnata",
      qe: Number(c.qest) > 1 ? Number(c.qest) : 0, date: x.date, time: x.time };
  }
  function fromCand(fx, a) {
    return { key: "f:" + fx.id + "|" + a.m, m: a.m, est: Number(a.est), safe: !!a.safe, no: (a.v || "").split("x").length - 1, qmin: Number(a.qmin) || 0,
      qb: Number(a.q) > 1 ? Number(a.q) : 0, qby: "bookmaker", qe: Number(a.qe) > 1 ? Number(a.qe) : 0, date: fx.date, time: fx.time };
  }
  // la quota da usare e da dove viene: "tua", "book" (vera del bookmaker), "stima" (quota probabile)
  function quote(o) {
    const u = userQ(o.key);
    if (u) return { q: u, src: "tua" };
    if (o.qb) return { q: o.qb, src: "book" };
    if (o.qe) return { q: o.qe, src: "stima" };
    return { q: 0, src: "" };
  }
  const quoteOf = (o) => quote(o).q;
  // quota che serve davvero: minima della stima + 3%, e almeno la tua quota minima personale
  const need = (o) => Math.max(o.qmin ? Math.ceil(o.qmin * EDGE * 100) / 100 : 0, myMin());
  const qtxt = (Q) => (Q.src === "stima" ? "quota probabile ~" + q2(Q.q) : Q.src === "tua" ? "la tua quota " + q2(Q.q) : "quota del bookmaker " + q2(Q.q));
  function started(o) {
    if (!o.date || !o.time) return false;
    const t = new Date(o.date + "T" + o.time + ":00");
    return !isNaN(t) && Date.now() >= t.getTime();
  }

  // VERDETTO: go = GIOCA, small = GIOCA PICCOLO, no = NON GIOCARE, na = nessun consiglio
  function verdict(o) {
    const Q = quote(o), q = Q.q, n = need(o), tail = Q.src === "stima" ? " (è una stima: scrivi la tua quota per essere precisi)" : "";
    if (o.est === null) return { k: "na", t: "NESSUN CONSIGLIO", why: "Per questo pronostico non c'è la lista dei controlli." };
    if (o.no > 0) return { k: "no", t: "NON GIOCARE", why: "Almeno un controllo è contro (✗)." };
    if (o.est < 65) return { k: "no", t: "NON GIOCARE", why: "La stima combinata è troppo bassa (" + o.est + "%)." };
    if (q && q < myMin()) return { k: "no", t: "NON GIOCARE", why: "Quota troppo bassa per te: " + qtxt(Q) + ", sotto la tua quota minima " + q2(myMin()) + "." + tail, low: true };
    if (q && q < n) return { k: "no", t: "NON GIOCARE", why: "Quota troppo bassa: " + qtxt(Q) + ", ne serve almeno " + q2(n) + ". Alla lunga si perde." + tail, low: true };
    if (o.safe) return { k: "go", t: "GIOCA", why: "Ha il bollino SICURO" + (q ? " e la quota conviene (" + qtxt(Q) + ")." + tail : ": gioca solo se la quota è almeno " + q2(n) + ".") };
    if (o.est >= 70) return { k: "small", t: "GIOCA PICCOLO", why: "Stima " + o.est + "% e nessun ✗, ma non è SICURO: puntata piccola" + (q ? " (" + qtxt(Q) + ")." + tail : ", e solo con quota almeno " + q2(n) + ".") };
    return { k: "no", t: "NON GIOCARE", why: "Stima " + o.est + "%: per giocare serve almeno il 70%." };
  }
  // PUNTATA: un quarto di Kelly, con i tetti
  function stake(o, v) {
    const q = quoteOf(o), C = cassa();

    const p = o.est / 100, f = (p * q - 1) / (q - 1);
    if (!(f > 0)) return { eur: 0, pct: 0 };
    const pct = Math.min(f / 4, v.k === "go" ? MAX_GO : MAX_SMALL);
    const k = DAYF[o.date] || 1;  // ridotta se le puntate del giorno superano il 10% della cassa
    let e = Math.round(C * pct * k * 2) / 2;
    if (e < 0.5) e = 0.5;
    return { eur: e, pct: e / C, f, cut: k < 1 };
  }
  const vtag = (v, small) => '<span class="cv cv-' + v.k + (small ? " sm" : "") + '">' + (small ? { go: "GIOCA", small: "PICCOLO", no: "NO", na: "—" }[v.k] : v.t) + "</span>";
  // DA GIOCARE: la più probabile tra le giocate provate che convengono
  function play(fx) {
    const a = fx && fx.adv; if (!a || !Array.isArray(a.c)) return null;
    const L = a.c.slice().sort((x, y) => y.est - x.est);
    for (const c of L) { const o = fromCand(fx, c), v = verdict(o); if (v.k === "go" || v.k === "small") return { c, o, v }; }

<script>
(function () {
  "use strict";

  //   leagues[].tab = classifica ufficiale ESPN { at, notes: [[zona, colore]], grp: [{ name, rows: [[squadra, pos, pg, v, n, p, gf, gs, punti, zona, penalità]] }] }

  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const U = () => window.APP.ui;
  const dm = (iso) => String(iso || "").slice(8, 10) + "/" + String(iso || "").slice(5, 7);
  const pc = (a, b) => (b ? Math.round((100 * a) / b) + "%" : "—");
  const avg = (a, b) => (b ? (a / b).toFixed(2).replace(".", ",") : "—");
  const sgn = (x) => (x > 0 ? "+" + x : String(x));

  const TABN = { gen: "classifica generale", home: "classifica in casa", away: "classifica in trasferta", pt: "classifica del primo tempo", st: "classifica del secondo tempo", gol: "i numeri dei gol" };

  // ---------- calcoli ----------
  // tutte le partite di una squadra viste da lei: { d, home, opp, gf, gs, hf, hs (PT), ff, fs (finale) }
  function teamGames(L) {
    const out = L.teams.map(() => []);
    for (const g of L.g || []) {
      const [d, h, a, hh, ha, fh, fa] = g;
      out[h].push({ d, home: true, opp: a, hf: hh, hs: ha, ff: fh, fs: fa });

  const goalsOf = (x, kind) => (kind === "pt" ? [x.hf, x.hs] : kind === "st" ? [x.ff - x.hf, x.fs - x.hs] : [x.ff, x.fs]);
  const res = (a, b) => (a > b ? "V" : a < b ? "P" : "N");

      let gs = TG[i].filter((x) => (kind === "home" ? x.home : kind === "away" ? !x.home : kind === "gol" ? (side === "all" ? true : side === "home" ? x.home : !x.home) : true));

        o15: 0, o25: 0, gg: 0, cs: 0, fts: 0, o05pt: 0, gpt: 0 };

  }
  // prossima partita di una squadra (calendario ESPN di stats.json)
  function nextOf(L, name) {
